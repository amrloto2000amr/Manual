مبدأ الأسبقية في التقديم؛ وبناءً عليه، كلما تم تقديم طلب الإجازة في وقت مبكر، زادت احتمالية الموافقة على الإجازة في التوقيت المطلوب.</p><p>ويُراعى عند اعتماد الإجازات عدم التأثير على سير العمل، لا سيما في حال تقدّم أكثر من موظف من الإدارة نفسها بطلب إجازة في الفترة ذاتها بما قد يُخلّ باستمرارية العمل.</p><p>عند إنهاء علاقة العمل، يجب استنفاد جميع الإجازات السنوية المستحقة قبل تاريخ المغادرة الفعلي. ويجوز -وفقاً لتقدير الإدارة- صرف مقابل مالي بدلاً عن رصيد الإجازات المستحق.</p><p>وفي حال مغادرة الموظف خلال سنة معينة وقد حصل على إجازات تفوق الرصيد المستحق حتى تاريخ المغادرة، يتم إجراء تسوية مالية تُخصم من الراتب النهائي، وذلك بما يتناسب مع مدة الخدمة الفعلية خلال تلك السنة.</p>","bodyEn":"<p>All annual leave requests must be submitted exclusively through the ZenHR system, which automatically tracks and updates each employee's leave balance. Leave approvals shall be granted by the Human Resources Department within the system itself. Requests must be submitted with a minimum of four (4) weeks' prior notice before the requested date (for non-urgent leave). Any leave request not registered through ZenHR and formally approved within the system shall not be considered valid.</p><p>Holiday requests made without giving 4-week notice will be considered at the discretion of management.</p><p>Holidays are granted on a 'first come first served' basis so the more notice you give the more likely it will be that you will be able to take your holiday when you wish.</p><p>When approving leave, due consideration shall be given to business continuity, particularly where multiple employees from the same department request leave during the same period.</p><p>On termination of employment all outstanding annual leave must have been taken prior to the effective date of departure. At the discretion of the Director, payment may be made in lieu of holiday entitlement.</p><p>If an employee leaves the Company during a given year after having taken leave in excess of the leave balance accrued up to the date of departure, a financial adjustment shall be made and deducted from the final salary, proportional to the employee's actual length of service during that year.</p>","sub":false,"keys":"حجز اجازة طلب zenhr موافقة holiday booking request","facts":[{"kAr":"مهلة تقديم الطلب","kEn":"Notice required","v":"4","uAr":"أسابيع","uEn":"weeks"},{"kAr":"القناة المعتمدة","kEn":"Channel","v":"ZenHR","uAr":"حصراً","uEn":"only"}],"pointsAr":["جميع طلبات الإجازة <b>حصراً عبر ZenHR</b>، والموافقة من الموارد البشرية داخل النظام — وأي إجازة لم تُسجَّل وتُعتمد عبره <b>لا يُعتد بها</b>.","الإشعار المطلوب <b>4 أسابيع</b> على الأقل للإجازات غير الفورية.","الإجازات تُمنح بمبدأ <b>الأسبقية في التقديم</b>، ومع مراعاة <b>استمرارية العمل</b> في القسم.","عند إنهاء الخدمة يجب <b>استنفاد الرصيد قبل المغادرة</b>، وقد يُصرف مقابل مالي بتقدير الإدارة.","من حصل على إجازات تفوق رصيده المستحق تُجرى <b>تسوية تُخصم من الراتب النهائي</b>."],"pointsEn":["All leave requests go <b>exclusively through ZenHR</b> and are approved there — leave not logged and approved in the system <b>is not valid</b>.","At least <b>four weeks' notice</b> is required for non-urgent leave.","Leave is granted <b>first come, first served</b>, with due regard to <b>business continuity</b>.","On termination, outstanding leave must be <b>taken before departure</b>; payment in lieu is at the Director's discretion.","Leave taken in excess of the accrued balance is <b>adjusted against the final salary</b>."]},{"id":"s6-2","ref":"6.2","ar":"العمل من المنزل","en":"Work From Home","bodyAr":"<p>في المدن التي يتواجد فيها مكاتب الشركة، لا تُشجع الشركة سياسة العمل من المنزل، وذلك نظراً لطبيعة العمل ومتطلبات خدمة العملاء والضيوف. وتُعدّ مقار العمل جزءاً أساسياً من القيمة التي تقدمها الشركة ومن طبيعة ما تنتجه كمنظومة عمل متكاملة.</p><p>ولكن، في حال دعت الحاجة إلى العمل من المنزل، يكون ذلك وفق تقدير المدير المباشر، على ألا تتجاوز أيام العمل عن بُعد نسبة 10% من إجمالي أيام العمل. وكما هو الحال مع الإجازات، تُقدّم جميع الطلبات حصرياً عبر نظام ZenHR، وتتم الموافقة على الطلبات من قِبل الموارد البشرية.</p><p>في حال احتياج الموظف للعمل عن بُعد لمدة تتجاوز 10% من إجمالي أيام العمل، يتم احتساب الأيام الزائدة على أنها إجازة غير مدفوعة الأجر. وفي هذه الحالة، يتم تعويض الموظف عن العمل من المنزل بواقع أربع (4) ساعات عمل يومياً فقط.</p><p>ويتحمل الموظف كامل المسؤولية في حال ترتّب على ذلك أي خلل في سير العمل أو الإخلال بمتطلبات الأداء.</p><p>سيتم مراجعة هذه السياسة بعد تطوير بعض آليات العمل داخل الشركة، وكذلك بعد دراسة أثر هذه السياسة على مستوى الإنتاجية بشكل عام.</p>","bodyEn":"<p>In cities where the Company operates physical offices, working from home is not encouraged due to the nature of the work and the requirements of serving clients and guests. The Company's offices are considered an essential part of the value we deliver and of the work we produce as an organization.</p><p>When working from home is required, it shall be at the discretion of the direct manager provided that remote working days do not exceed 10% of total working days. As with leave requests, working from home requests must be submitted exclusively through the ZenHR System, Approvals shall be granted by the HR.</p><p>If an employee requires working remotely for more than 10% of total working days, any additional days shall be counted as unpaid leave. In such cases, the employee shall be compensated for working from home on the basis of four (4) working hours per day only.</p><p>The employee shall bear full responsibility if this arrangement results in any disruption to work performance or business operations.</p><p>This policy shall be reviewed following the development of certain internal work mechanisms and after assessing its overall impact on productivity.</p>","sub":false,"keys":"عمل من المنزل ريموت wfh work from home","facts":[{"kAr":"الحد الأقصى","kEn":"Maximum","v":"10%","uAr":"من أيام العمل","uEn":"of working days"},{"kAr":"احتساب اليوم الزائد","kEn":"Days beyond cap","v":"4","uAr":"ساعات فقط","uEn":"hours only"}],"pointsAr":["العمل من المنزل <b>غير مشجَّع</b> في المدن التي بها مكاتب للشركة؛ المكاتب جزء أساسي من قيمة ما تقدّمه الشركة.","عند الحاجة يكون <b>بتقدير المدير المباشر</b> وبما لا يتجاوز <b>10% من إجمالي أيام العمل</b>.","جميع الطلبات <b>عبر ZenHR</b> حصراً وتُعتمد من الموارد البشرية.","ما زاد عن 10% يُحتسب <b>إجازة بدون أجر</b>، ويُعوَّض عن يوم العمل من المنزل بـ<b>4 ساعات عمل فقط</b>.","يتحمل الموظف <b>كامل المسؤولية</b> عن أي خلل في سير العمل أو الأداء نتيجة ذلك."],"pointsEn":["Working from home is <b>not encouraged</b> where the Company has offices; the offices are core to the value we deliver.","When needed it is at the <b>line manager's discretion</b> and must not exceed <b>10% of total working days</b>.","All requests go <b>through ZenHR</b> and are approved by HR.","Days beyond the 10% cap are <b>unpaid leave</b>, and a WFH day is credited as <b>four working hours only</b>.","The employee bears <b>full responsibility</b> for any disruption to work or performance."]}]},{"id":"s7","no":"7","ar":"الإجازات الخاصة والغياب","en":"Time Off","policies":[{"id":"s7-1","ref":"7.1","ar":"ترتيبات الإجازات الخاصة","en":"Special Leave Arrangement","bodyAr":"<p>تُؤخذ بعين الاعتبار، وبروح من التعاطف، أي ظروف إنسانية أو صعوبات أو حالات خاصة قد تستدعي طلب الغياب عن العمل لأسباب إنسانية. وقد تشمل هذه الظروف -على سبيل المثال لا الحصر- حالات الوفاة أو المرض الشديد لأحد الأقارب المباشرين أو المعالين.</p><p>يُتوقّع من الموظفين استخدام رصيد الإجازات السنوية قدر الإمكان لتلبية شؤونهم الشخصية. ويجوز منح إجازة خاصة إضافية غير مدفوعة تتجاوز الاستحقاقات القانونية، وذلك في حالات استثنائية ووفقاً لتقدير المدير المباشر بالتعاون مع إدارة الموارد البشرية. ويتم النظر في كل طلب على حدته بناءً على مبرراته، مع ضرورة تقديم إشعار مسبق قدر الإمكان.</p><p>لا يُسمح عادة بطلبات الإجازات غير مدفوعة الأجر، إلا إذا كانت مرتبطة بالظروف الخاصة الموضحة أعلاه.</p>","bodyEn":"<p>Sympathetic consideration will be given to any hardship, difficulty or special circumstances which might necessitate a request for absence from work on compassionate grounds. Such circumstances might include bereavement or severe illness of a close relative or dependant.</p><p>Employees are expected to use their annual leave as far as possible for attending to personal affairs, special unpaid leave more than any statutory entitlement may be allowed in exceptional circumstances at the discretion of the line manager in cooperation with the HR Department. Each request will be considered on its merits but as much notice as possible must be given.</p><p>Requests for unpaid leave will not normally be allowed except if they relate to the special circumstances described above.</p>","sub":false,"keys":"اجازة خاصة ظروف وفاة مرض قريب compassionate special leave unpaid","pointsAr":["تُراعى <b>الظروف الإنسانية</b> مثل وفاة أو مرض شديد لقريب مباشر أو معال.","يُتوقع استخدام <b>الرصيد السنوي</b> أولاً لتلبية الشؤون الشخصية.","قد تُمنح <b>إجازة خاصة غير مدفوعة</b> تتجاوز الاستحقاق النظامي في حالات استثنائية بتقدير المدير المباشر مع الموارد البشرية.","طلبات الإجازة بدون أجر <b>لا تُقبل عادةً</b> إلا في هذه الظروف الخاصة."],"pointsEn":["<b>Compassionate circumstances</b> such as bereavement or severe illness of a close relative or dependant are considered sympathetically.","You are expected to use your <b>annual leave</b> first for personal matters.","<b>Special unpaid leave</b> beyond statutory entitlement may be granted exceptionally at the line manager's discretion with HR.","Unpaid leave requests are <b>not normally allowed</b> outside these circumstances."]},{"id":"s7-2","ref":"7.2","ar":"سياسة احتساب العطلة الأسبوعية ضمن الإجازة السنوية","en":"Weekly Day Off Calculation Within Annual Leave Policy","bodyAr":"<p>في حال تداخلت العطلة الأسبوعية مع أيام الإجازة السنوية، فإنها تُحتسب ضمن مدة الإجازة السنوية متى كانت واقعة داخل نطاقها، باعتبار أن الإجازة السنوية قد تتخللها أيام راحة أسبوعية.</p><p>أما إذا سبقت العطلة الأسبوعية بداية الإجازة السنوية أو جاءت بعدها مباشرة، فلا تُحتسب ضمن رصيد الإجازة.</p><p><strong>أمثلة توضيحية:</strong></p><ul><li>إذا بدأت إجازة الموظف يوم الأحد أو انتهت يوم الخميس، فلا يُحتسب يوما الجمعة والسبت (العطلة الأسبوعية) ضمن الإجازة السنوية.</li><li>أما إذا بدأت الإجازة يوم الاثنين وانتهت يوم الأحد، فتُحتسب جميع أيام العطلة الأسبوعية الواقعة خلال هذه الفترة ضمن الإجازة السنوية، ولا يترتب عليها أي تعويض.</li></ul>","bodyEn":"<p>If the weekly day off overlaps with the annual leave period, it shall be counted as part of the annual leave if it falls within the leave duration, as annual leave may include weekly rest days within its period.</p><p>However, if the weekly day off precedes the start of the annual leave or immediately follows its end, it shall not be counted as part of the leave balance.</p><p><strong>Illustrative Examples:</strong></p><ul><li>If an employee's leave starts on Sunday or ends on Thursday, Friday and Saturday (the weekly days off) shall not be counted as part of the annual leave.</li><li>However, if the leave starts on Monday and ends on Sunday, all weekly days off falling within that period shall be counted as part of the annual leave, with no compensation provided.</li></ul>","sub":true,"keys":"عطلة اسبوعية جمعة سبت احتساب weekend within leave","pointsAr":["العطلة الأسبوعية <b>الواقعة داخل</b> مدة الإجازة السنوية <b>تُحتسب</b> ضمنها.","العطلة الأسبوعية <b>السابقة مباشرة</b> لبداية الإجازة أو <b>اللاحقة مباشرة</b> لنهايتها <b>لا تُحتسب</b>.","مثال: إجازة تبدأ الأحد وتنتهي الخميس ← <b>الجمعة والسبت لا يُحتسبان</b>. إجازة تبدأ الاثنين وتنتهي الأحد ← <b>تُحتسب</b> أيام العطلة داخلها."],"pointsEn":["A weekly day off <b>falling inside</b> the annual leave period <b>is counted</b> as leave.","A weekly day off <b>immediately before</b> or <b>immediately after</b> the leave <b>is not counted</b>.","Example: leave from Sunday to Thursday → <b>Friday and Saturday are not counted</b>. Leave from Monday to Sunday → the weekend days inside <b>are counted</b>."]},{"id":"s7-3","ref":"7.3","ar":"إجازات الأمومة والأبوة","en":"Maternity/Paternity Leaves","bodyAr":"<p>تستحق الموظفات العاملات في الشركة إجازة أمومة وفقاً لما ينص عليه قانون العمل المعمول به في الدولة التي يعملن بها.</p><p>عند انتهاء إجازة الأمومة، يحق للموظفة تمديد الإجازة لمدة أقصاها ثلاثون (30) يوماً دون أجر. ويجوز أن تكون هذه الإجازة غير المدفوعة متصلة أو متقطعة، إذا كانت بسبب مرض ناتج عن الحمل أو الولادة، يمنع الموظفة من العودة إلى العمل، على أن يتم إثبات الحالة المرضية بشهادة طبية صادرة عن طبيب حكومي معتمد من الجهة الصحية المختصة.</p><p>لا يتم خصم الإجازات الممنوحة في الحالات المشار إليها أعلاه من أي إجازات أخرى تستحقها الموظفة العاملة.</p><p>تُمنح الموظفات ساعات رضاعة إضافية إذا كان ذلك منصوصاً عليه في قانون العمل المعمول به في الدولة.</p><p>يستحق الموظفون الذكور في Approach إجازة أبوة مدفوعة الأجر، في حال كان ذلك مقرراً وفقاً لقانون العمل في الدولة المعنية، كما هو مذكور في الملحق الثاني.</p>","bodyEn":"<p>Working women in the company will be entitled to the maternity leave allocated by the labor law of the country you are based in.</p><p>At the end of the maternity leave, a working woman has the right to extend her maternity leave for a maximum period of thirty (30) days without pay. This unpaid leave can be continuous or intermittent if the leave is caused by illness resulting from pregnancy or delivery, and which prevents her from coming to work. The illness must be confirmed by a certified government physician licensed by the competent health authority.</p><p>Leave provided in the above cases is not deducted from any other leave that a working woman employee is entitled to.</p><p>Any additional nursing hours will be provided if mentioned in the labor law of the country.</p><p>Working men of Approach will be entitled to paid paternity leave if entitled as per the labor law in the country as mentioned in appendix 2.</p>","sub":false,"keys":"امومة ابوة ولادة رضاعة maternity paternity nursing","facts":[{"kAr":"إجازة الوضع (السعودية)","kEn":"Maternity (KSA)","v":"12","uAr":"أسبوعاً بأجر كامل","uEn":"weeks full pay"},{"kAr":"تمديد غير مدفوع","kEn":"Unpaid extension","v":"30","uAr":"يوماً","uEn":"days"},{"kAr":"إجازة الأبوة (السعودية)","kEn":"Paternity (KSA)","v":"3","uAr":"أيام","uEn":"days"}],"pointsAr":["إجازة الأمومة وفق قانون عمل الدولة — في السعودية <b>12 أسبوعاً بأجر كامل</b>، منها <b>6 أسابيع بعد الولادة إلزامية</b>.","بعد انتهائها يحق تمديدها <b>30 يوماً بدون أجر</b>، متصلة أو متقطعة، إذا كان المرض ناتجاً عن الحمل أو الولادة <b>بشهادة طبية من طبيب حكومي معتمد</b>.","هذه الإجازات <b>لا تُخصم</b> من أي إجازات أخرى مستحقة.","<b>ساعات الرضاعة</b> تُمنح إذا نصّ عليها قانون الدولة.","إجازة الأبوة مدفوعة إذا قررها قانون الدولة — <b>3 أيام في السعودية</b>، <b>5 أيام في الإمارات</b>، <b>يوم واحد</b> للموظفين الدوليين."],"pointsEn":["Maternity leave follows local law — in KSA <b>12 weeks at full pay</b>, of which <b>six weeks after delivery are mandatory</b>.","It may be extended by <b>30 unpaid days</b>, continuous or intermittent, for illness caused by pregnancy or delivery, <b>certified by an approved government physician</b>.","Such leave is <b>not deducted</b> from any other entitlement.","<b>Nursing hours</b> are granted where local law provides for them.","Paid paternity leave where local law provides — <b>3 days in KSA</b>, <b>5 days in the UAE</b>, <b>1 day</b> for international employees."]},{"id":"s7-4","ref":"7.4","ar":"الإجازات الرسمية وسياسة المناطق الزمنية للعمل","en":"Public Holidays & Work Time Zone Policy","bodyAr":"<p>تعمل شركة Approach عبر عدة مناطق جغرافية، ويتم تحديد استحقاقات الإجازات الرسمية بناءً على دولة العمل وكذلك الفريق أو السوق الذي يقدّم له الموظف دعمه الأساسي.</p><p>في حال كان الموظف مقيماً في دولة تمتلك فيها الشركة وجوداً تشغيلياً فعالاً أو كياناً قانونياً مسجلاً، فإن استحقاقات الإجازات الخاصة به تخضع لقانون العمل المعمول به في تلك الدولة.</p>","bodyEn":"<p>Approach Communications operates across multiple regions, and leave entitlements are determined based on the country of operation and the team or market an employee primarily supports.</p><p>If an employee is based in a country where we have an active operation or formally established legal presence, their leave entitlements will follow that country's labor law.</p>","sub":false,"keys":"اجازات رسمية مناطق زمنية public holidays time zone","pointsAr":["استحقاق الإجازات الرسمية يُحدَّد بـ<b>دولة العمل</b> وبالفريق أو السوق الذي يدعمه الموظف أساساً.","الموظف المقيم في دولة فيها <b>وجود تشغيلي أو كيان قانوني</b> للشركة تخضع استحقاقاته <b>لقانون عمل تلك الدولة</b>."],"pointsEn":["Public-holiday entitlement is set by the <b>country of operation</b> and the team or market you primarily support.","If you are based where the Company has an <b>active operation or legal presence</b>, entitlements follow <b>that country's labour law</b>."]},{"id":"s7-5","ref":"7.5","ar":"الإجازات المرضية","en":"Sickness Absence","bodyAr":"<p>تلتزم شركة Approach بالحفاظ على صحة وسلامة ورفاهية جميع موظفيها، وتُقدّر الإسهامات التي يقدمها الموظفون في نجاح الشركة، وتشعر الشركة بتأثير غياب هذا الإسهام عندما يتعذر على أي موظف أداء عمله بسبب المرض.</p><p>يستحق جميع الموظفين الدائمين إجازات مرضية طوال فترة عملهم لدى Approach، وذلك وفقاً لأحكام نظام العمل المعمول به في المملكة العربية السعودية.</p><p>أما الموظفون الدوليون، فيُسمح لهم بالحصول على إجازات مرضية بحد أقصى خمسة عشر (15) يوماً سنوياً.</p><p>وفي كل الأحوال، يتعيّن على الموظف تسجيل الإجازة المرضية عبر نظام ZenHR في أقرب وقت ممكن، مع إخطار المدير المباشر وإدارة الموارد البشرية قبل بدء يوم العمل. ويتولى النظام تتبع رصيد الأيام المرضية المستخدمة والمتبقية تلقائياً.</p><p>ولا يجوز استخدام الإجازات المرضية كبديل عن الإجازات الشخصية أو السنوية. ويُشترط تقديم تقرير طبي معتمد إلى إدارة الموارد البشرية في حال طلب إجازة مرضية تزيد عن يوم واحد.</p><p>كما يحق للموظفين الحصول على إجازات مرضية مدفوعة الأجر خلال فترة التجربة. وبعد اجتياز فترة التجربة بنجاح، تُطبّق استحقاقات الإجازات المرضية وفقاً لقانون العمل في الدولة المعنية.</p><p>وفي حال الإجازة المرضية لمدة يوم واحد، لا يُشترط تقديم تقرير أو شهادة طبية. وفي حال تجاوز الإجازة المرضية يوماً واحداً أو في حال تكرار الإجازات المرضية بشكل ملحوظ، يحق للشركة طلب تقرير طبي معتمد.</p>","bodyEn":"<p>Approach Communication is committed to maintaining the health, well-being and safety of all our employees. We value the contribution our employees make to our success and we miss that contribution when any employee is unable to work.</p><p>All permanent employees are entitled to sick leave throughout their employment with Approach, in accordance with the Saudi Labor Law.</p><p>For international employees, sick leave entitlement shall be limited to a maximum of fifteen (15) annual days.</p><p>Employees are required to register sick leave through the ZenHR system as soon as possible, while notifying their direct manager and the Human Resources Department before the start of the working day. The system automatically tracks the number of sick days used and the remaining balance.</p><p>Sick days are not available to supplement personal and vacation days – a sufficient doctor prescription must be submitted to HR if requested for leave longer than one day.</p><p>Employees are entitled to paid sick leave during the probation period. However, after successful completion of the probationary period, the sick leave entitlement is as per the labor law of the country.</p><p>For one-day sick leave, no medical report or doctor's certificate is required. If sick leave exceeds one day or in cases of frequent sick leave, the Company reserves the right to request an approved medical report.</p>","sub":false,"keys":"مرضية مرض تقرير طبي sick leave medical report","facts":[{"kAr":"بأجر كامل (السعودية)","kEn":"Full pay (KSA)","v":"0–30","uAr":"يوماً","uEn":"days"},{"kAr":"بنسبة 75%","kEn":"At 75%","v":"31–90","uAr":"يوماً","uEn":"days"},{"kAr":"بدون أجر","kEn":"Unpaid","v":"91–120","uAr":"يوماً","uEn":"days"}],"pointsAr":["الإجازة المرضية لموظفي السعودية وفق نظام العمل: <b>0–30 يوماً بأجر كامل</b>، <b>31–90 بنسبة 75%</b>، <b>91–120 بدون أجر</b>.","الموظفون الدوليون: بحد أقصى <b>15 يوماً سنوياً</b>.","يجب تسجيل الإجازة على <b>ZenHR</b> في أقرب وقت مع إخطار المدير والموارد البشرية <b>قبل بداية يوم العمل</b>.","الإجازة المرضية <b>ليست بديلاً</b> عن الإجازة الشخصية أو السنوية.","<b>يوم واحد:</b> لا يلزم تقرير طبي. <b>أكثر من يوم</b> أو التكرار الملحوظ: للشركة طلب <b>تقرير طبي معتمد</b>.","الإجازة المرضية <b>مدفوعة خلال فترة التجربة</b>، وبعدها وفق قانون الدولة."],"pointsEn":["For KSA employees: <b>0–30 days at full pay</b>, <b>31–90 at 75%</b>, <b>91–120 unpaid</b>.","International employees: a maximum of <b>15 days per year</b>.","Register it on <b>ZenHR</b> as soon as possible and notify your manager and HR <b>before the working day starts</b>.","Sick leave is <b>not a substitute</b> for personal or annual leave.","<b>One day:</b> no certificate needed. <b>More than one day</b> or frequent absences: the Company may require an <b>approved medical report</b>.","Sick leave is <b>paid during probation</b>; thereafter it follows local law."]}]},{"id":"s8","no":"8","ar":"الرواتب والمزايا","en":"Payroll & Benefits","policies":[{"id":"s8-1","ref":"8.1","ar":"صرف الرواتب","en":"Payment of Salaries","bodyAr":"<p>يتم صرف الرواتب في اليوم الأخير من كل شهر ميلادي عن طريق التحويل البنكي، وذلك وفقاً لما هو منصوص عليه في عقد العمل.</p><p>وسيتم إخطار الموظفين بأي تغييرات لاحقة تطرأ على رواتبهم.</p>","bodyEn":"<p>Salaries are paid on the last day of each calendar month by bank transfer as stated in the contract of employment.</p><p>Employees will be notified of any subsequent changes to their salary.</p>","sub":false,"keys":"راتب صرف تحويل بنكي salary payment date","facts":[{"kAr":"موعد الصرف","kEn":"Pay date","v":"آخر يوم من الشهر","uAr":"","uEn":"","vEn":"Last day of month"},{"kAr":"الوسيلة","kEn":"Method","v":"تحويل بنكي","uAr":"","uEn":"","vEn":"Bank transfer"}],"pointsAr":["تُصرف الرواتب في <b>اليوم الأخير من كل شهر ميلادي</b> عن طريق <b>التحويل البنكي</b> وفق عقد العمل.","يُخطَر الموظف بأي <b>تغييرات لاحقة</b> على راتبه."],"pointsEn":["Salaries are paid on the <b>last day of each calendar month</b> by <b>bank transfer</b> as per the contract.","Employees are notified of any <b>subsequent changes</b> to their salary."]},{"id":"s8-2","ref":"8.2","ar":"الاستقطاعات من الرواتب","en":"Deduction from Salaries","bodyAr":"<p>تقوم الشركة بإجراء أي استقطاعات من راتب الموظف وفقاً لما يقتضيه القانون أو بناءً على تفويض كتابي صادر من الموظف.</p><p>وتحتفظ Approach بحقها في إجراء تعديلات على الراتب في حال وجود مدفوعات زائدة، أو في حالات الإضرار المتعمد التي تؤدي إلى إنهاء الخدمة.</p>","bodyEn":"<p>We will make any deductions from employees' pay as required by law or as authorized by the employee in writing.</p><p>Approach reserves the right to make salary adjustments to the employees pay where an overpayment has been made or in cases of malicious damage which result in dismissal.</p>","sub":false,"keys":"استقطاع خصم من الراتب deduction salary","pointsAr":["تُجرى الاستقطاعات <b>وفق ما يقتضيه القانون</b> أو <b>بتفويض كتابي</b> من الموظف.","للشركة حق تعديل الراتب عند وجود <b>مدفوعات زائدة</b> أو في حالات <b>الإضرار المتعمد</b> المؤدية لإنهاء الخدمة."],"pointsEn":["Deductions are made <b>as required by law</b> or <b>with your written authorization</b>.","The Company may adjust pay where an <b>overpayment</b> was made or in cases of <b>malicious damage</b> resulting in dismissal."]},{"id":"s8-3","ref":"8.3","ar":"مكافأة نهاية الخدمة","en":"End of Service","bodyAr":"<p>يتم احتساب مكافأة نهاية الخدمة وفقاً لأحكام قانون العمل المعمول به في الدولة. وسيتم إخطار الموظف بتفاصيلها من قِبل الشركة عبر البريد الإلكتروني.</p>","bodyEn":"<p>End of service will be calculated based on the labor law clause of the country. This will be communicated to the employee by the company via email.</p>","sub":false,"keys":"نهاية الخدمة مكافأة gratuity end of service","facts":[{"kAr":"أول 5 سنوات (السعودية)","kEn":"First 5 years (KSA)","v":"½","uAr":"أجر شهر عن كل سنة","uEn":"month per year"},{"kAr":"ما بعد 5 سنوات","kEn":"After 5 years","v":"1","uAr":"أجر شهر عن كل سنة","uEn":"month per year"}],"pointsAr":["تُحتسب المكافأة وفق <b>قانون عمل الدولة</b> ويُخطَر بها الموظف من الشركة بالبريد الإلكتروني.","في <b>السعودية</b>: <b>نصف أجر شهر</b> عن كل سنة من السنوات الخمس الأولى، و<b>أجر شهر كامل</b> عن كل سنة تالية (الملحق 2).","في <b>الإمارات</b>: لا استحقاق لأقل من سنة؛ و<b>21 يوماً</b> عن كل سنة لأقل من خمس سنوات، و<b>30 يوماً</b> عن كل سنة بعدها."],"pointsEn":["Gratuity is calculated under the <b>applicable labour law</b> and communicated by email.","In <b>KSA</b>: <b>half a month's wage</b> per year for the first five years, and <b>one month's wage</b> per subsequent year (Appendix 2).","In the <b>UAE</b>: nothing below one year; <b>21 days</b> per year under five years and <b>30 days</b> per year thereafter."]},{"id":"s8-4","ref":"8.4","ar":"المكافأة السنوية","en":"Annual Bonus","bodyAr":"<p>تسعى الشركة إلى منح مكافأة سنوية للموظفين على أساس تقديري، وذلك اعتماداً على أداء الشركة وأداء الموظف.</p>","bodyEn":"<p>The Company will endeavor to provide an annual bonus to employees as discretionary, depending on business and employee performances.</p>","sub":false,"keys":"مكافأة سنوية بونص bonus","pointsAr":["تسعى الشركة لمنح <b>مكافأة سنوية تقديرية</b>، وتعتمد على <b>أداء الشركة وأداء الموظف</b> معاً."],"pointsEn":["The Company endeavours to pay a <b>discretionary annual bonus</b>, depending on <b>business and employee performance</b>."]},{"id":"s8-5","ref":"8.5","ar":"سياسات التعويضات والزيادة السنوية","en":"Compensation & Salaries Increase","bodyAr":"<p>يتم احتساب الرواتب والإفصاح عنها وفقاً للقوانين والأنظمة والممارسات المعمول بها، وبما يتوافق مع ما تم الاتفاق عليه عند التعاقد.</p><p>وفقاً لقانون العمل المعمول به، قد تُطبّق استقطاعات إلزامية معينة، ويخضع ذلك للتغيير بحسب التعديلات القانونية.</p><p>ستقوم الشركة بتوفير التأمين الصحي ومكافأة نهاية الخدمة للموظفين، على أن يتم إضافة مزايا أخرى إلى حزمة التعويضات خلال الفترة القريبة القادمة.</p><p>تعتمد الشركة فترتين سنويتين للزيادات: في شهر يناير، على أن تسري الزيادة اعتباراً من 1 يناير؛ وفي شهر يوليو، على أن تسري الزيادة اعتباراً من 1 يوليو.</p><p>اعتباراً من تاريخ الانضمام، لا توجد أي وعود بزيادة في الراتب، ولا يتم منح أي زيادة خلال السنة الأولى من التوظيف ما لم تكن مدونة بشكل رسمي في العقد.</p><p>تعمل الشركة حالياً على وضع هيكل شرائح رواتب ثابتة لكل وظيفة داخل كل سوق. وبمجرد اعتمادها، سيتم تطبيق هذه الشرائح بشكل منتظم، مع إمكانية مراجعتها في بداية كل سنة مالية وفقاً لمتغيرات مثل: التضخم، أو انخفاض قيمة العملة، أو أي تغييرات جوهرية في السياسات النقدية أو المالية، وسيتم توضيح الاعتبارات الخاصة بذلك لاحقاً.</p>","bodyEn":"<p>Salaries shall be calculated and disclosed in accordance with applicable laws, regulations, and standard practices, and as agreed upon at the time of contracting.</p><p>Depending on labor law, there may be certain deductions necessary (this is subject to change based on labor law adjustments).</p><p>Health insurance and employee gratuity will be provided by the company. Additional benefits will be introduced and added to the compensation package in the near future.</p><p>The company has two increment windows annually: one in January, to take effect from 1st January, and one in July, to take effect from the 1st of July.</p><p>From the date of joining, there will be no 'promise' of a higher salary, and no increment in the first year of employment unless it's mentioned in the contract of employment.</p><p>The company is currently working on establishing fixed salary brackets for each role within each market. Once finalized, these brackets will be applied consistently. They may be subject to revision at the start of each fiscal year to reflect factors such as inflation, currency devaluation, or other fundamental monetary or fiscal changes. Any related considerations will be clarified at a later stage.</p>","sub":false,"keys":"زيادة علاوة تعويضات تأمين صحي increase compensation insurance","facts":[{"kAr":"نوافذ الزيادة","kEn":"Increment windows","v":"يناير ويوليو","uAr":"","uEn":"","vEn":"January & July"},{"kAr":"السنة الأولى","kEn":"First year","v":"بدون زيادة","uAr":"","uEn":"","vEn":"No increment"}],"pointsAr":["الشركة توفّر <b>التأمين الصحي</b> و<b>مكافأة نهاية الخدمة</b>، مع مزايا إضافية لاحقاً.","نافذتان للزيادة سنوياً: <b>يناير</b> (تسري من 1 يناير) و<b>يوليو</b> (تسري من 1 يوليو).","<b>لا وعود</b> بزيادة، ولا زيادة في <b>السنة الأولى</b> من التوظيف ما لم تُنص في العقد.","يجري العمل على <b>شرائح رواتب ثابتة</b> لكل وظيفة في كل سوق، تُراجع مع بداية كل سنة مالية وفق التضخم وتغيرات العملة."],"pointsEn":["The Company provides <b>health insurance</b> and <b>end-of-service gratuity</b>, with further benefits to come.","Two increment windows a year: <b>January</b> (effective 1 Jan) and <b>July</b> (effective 1 Jul).","<b>No promise</b> of an increase, and none in the <b>first year</b> unless stated in the contract.","Fixed <b>salary brackets</b> per role per market are being established, reviewable each fiscal year for inflation and currency changes."]}]},{"id":"s9","no":"9","ar":"التقنيات والبيانات","en":"Tech & Data","policies":[{"id":"s9-1","ref":"9.1","ar":"استخدام الحواسيب","en":"Use of Computer","bodyAr":"<p>تم وضع سياسة تقنية المعلومات والإنترنت والبريد الإلكتروني الخاصة بالشركة بهدف حماية أجهزة الحاسوب التابعة للمؤسسة، ومنع أي استخدام غير لائق، وضمان حماية البيانات والمعلومات السرية المخزنة على الأنظمة والملفات الإلكترونية.</p><p>يُتوقّع من كل موظف التأكد من أن سلوكه واستخدامه للأجهزة والأنظمة يتوافقان مع المعايير والضوابط المنصوص عليها في هذه السياسة.</p><p>في حال تعرّض جهاز الحاسوب المحمول المملوك للشركة للسرقة أثناء وجوده في حيازة الموظف، وعدم كفاية تغطية التأمين الخاص بالمكتب لتعويض الخسارة بالكامل، قد يُطلب من الموظف تحمل تكلفة الجهاز. وفي هذه الحالة، يتم خصم القيمة من مستحقات الموظف المالية لمعالجة الآثار المالية المترتبة على فقدان الجهاز المملوك للشركة، وذلك وفقاً لقوانين العمل المعمول بها في كل دولة.</p><p>بالنسبة للموظفين الدوليين، عند تقدّم الموظف بطلب للحصول على جهاز حاسوب محمول (لابتوب)، تقوم الشركة بدراسة كل طلب بشكل منفصل وفقاً لظروف وطبيعة العمل.</p><p>وبعد اجتياز الموظف فترة التجربة بنجاح، يجوز للشركة منحه قرضاً أو سلفة لشراء الجهاز، على أن يتم خصم قيمتها من راتبه على مدة لا تتجاوز أربعة أشهر.</p>","bodyEn":"<p>The organization's IT, Internet and E-mail Policy is designed to protect the organization's computer equipment, prevent inappropriate use and protect confidential data stored on computer files.</p><p>Every employee must ensure that his/her conduct conforms to the standards set out in this policy.</p><p>In the event that a company-provided laptop is stolen while in the employee's possession, and the office insurance does not fully cover the loss, the employee may be required to bear the cost of the laptop. This amount would then be deducted from their remuneration as a means of addressing the financial implications associated with the company-owned laptop in accordance with each country's labor laws.</p><p>For international employees, if an employee submits a request to obtain a laptop, the company will review each request on a case-by-case basis, depending on the role and work requirements.</p><p>Upon successful completion of the probation period, the company may grant the employee a loan or advance to purchase the device, which will be deducted from the employee's salary over a period not exceeding four months.</p>","sub":false,"keys":"حاسوب لابتوب جهاز سرقة قرض computer laptop theft loan","facts":[{"kAr":"سداد قرض الجهاز","kEn":"Device loan repayment","v":"4","uAr":"أشهر كحد أقصى","uEn":"months max"}],"pointsAr":["سياسة تقنية المعلومات تهدف لحماية أجهزة الشركة ومنع الاستخدام غير اللائق وحماية البيانات السرية.","عند <b>سرقة لابتوب الشركة</b> وعدم كفاية التأمين، قد يتحمل الموظف التكلفة وتُخصم من مستحقاته وفق قانون العمل.","طلب اللابتوب للموظف الدولي يُدرس <b>حالة بحالة</b> حسب طبيعة العمل.","بعد اجتياز فترة التجربة قد تمنح الشركة <b>قرضاً لشراء الجهاز</b> يُخصم على مدة لا تتجاوز <b>4 أشهر</b>."],"pointsEn":["The IT policy protects Company equipment, prevents inappropriate use and safeguards confidential data.","If a Company laptop is <b>stolen</b> and insurance does not cover it, the cost may be deducted from your remuneration under local law.","Laptop requests from international employees are reviewed <b>case by case</b>.","After probation the Company may grant a <b>loan to buy the device</b>, repaid over no more than <b>four months</b>."]},{"id":"s9-2","ref":"9.2","ar":"حماية البيانات والسرية","en":"Data Protection & Confidentiality","bodyAr":"<p>يحظر على أي موظف الإفصاح عن أي معلومات سرية، سواء أثناء فترة العمل أو بعد انتهائها، إلا في حال الحصول على إذن صريح بذلك ووفقاً لما تسمح به قوانين العمل المعمول بها في كل دولة.</p><p>ويُتعامل مع أي خرق لسياسة السرية وفقاً للإجراءات التأديبية والقانونية المعتمدة، وقد يؤدي ذلك إلى إنهاء الخدمة.</p>","bodyEn":"<p>No employee should disclose any confidential information either while employed or after having left the organization, unless specifically given permission to do so in accordance with each country's labor laws.</p><p>Any breach of confidentiality will be dealt with under the disciplinary and legal procedures and may lead to dismissal.</p>","sub":false,"keys":"سرية بيانات افشاء confidentiality data protection","pointsAr":["يُحظر الإفصاح عن أي <b>معلومات سرية</b> أثناء العمل <b>أو بعد انتهائه</b> إلا بإذن صريح.","خرق السرية يُعالج بالإجراءات <b>التأديبية والقانونية</b> وقد يؤدي إلى <b>إنهاء الخدمة</b>."],"pointsEn":["No confidential information may be disclosed during employment <b>or after leaving</b>, unless expressly permitted.","Any breach is handled under <b>disciplinary and legal procedures</b> and may lead to <b>dismissal</b>."]},{"id":"s9-3","ref":"9.3","ar":"تخزين البيانات وإدارتها","en":"Data Storage & Management","bodyAr":"<p>يلتزم جميع الموظفين بحفظ جميع المستندات المتعلقة بالعمل على Google Drive داخل المجلدات المخصصة لها بعناوين واضحة ومنظّمة. ويُحظر حفظ مستندات غير معنونة أو غير ضرورية داخل المجلدات لما يسببه ذلك من ارتباك وعدم تنظيم.</p><p>كما يجب حفظ جميع المستندات التي يتم تبادلها عبر البريد الإلكتروني داخل مجلداتها المخصصة على Google Drive.</p>","bodyEn":"<p>All Employees must store work-related documents on Google Drive in their respective folders with titles. There should be no unwanted or unnamed document saved in folders as it creates confusion.</p><p>All emailed documents should be saved to their respective folders.</p>","sub":false,"keys":"تخزين جوجل درايف ملفات storage google drive","pointsAr":["تُحفظ جميع مستندات العمل على <b>Google Drive</b> داخل المجلدات المخصصة وبعناوين واضحة.","<b>يُحظر</b> حفظ مستندات غير معنونة أو غير ضرورية داخل المجلدات.","كل مستند يُتبادل عبر <b>البريد الإلكتروني</b> يجب حفظه في مجلده المخصص على Drive."],"pointsEn":["Store all work documents on <b>Google Drive</b> in their folders with clear titles.","Unnamed or unnecessary documents <b>must not</b> be left in folders.","Every document exchanged by <b>email</b> must be saved to its respective Drive folder."]}]},{"id":"s10","no":"10","ar":"الجزاءات التأديبية","en":"Disciplinary Penalties","policies":[{"id":"s10-0","ref":"10","ar":"الجزاءات التأديبية","en":"Disciplinary Penalties","bodyAr":"<p><strong>وفقاً لأحكام نظام العمل في المملكة العربية السعودية:</strong></p><p>يجوز للشركة توقيع جزاءات تأديبية على الموظف عند مخالفته للأنظمة أو الإخلال بواجباته الوظيفية، وذلك بعد التحقيق معه، وإخطاره كتابياً بالجزاء الموقّع عليه. وتشمل هذه الجزاءات:</p><ul><li>الإنذار الكتابي.</li><li>الغرامة من خلال خصم من الأجر، بما لا يجاوز أجر خمسة أيام في الشهر الواحد.</li><li>الحرمان من العلاوة السنوية أو تأجيلها لمدة لا تزيد على سنة.</li><li>تأجيل الترقية لمدة لا تزيد على سنة.</li><li>الإيقاف عن العمل لمدة لا تتجاوز خمسة أيام مع الحرمان من الأجر في حدود خمسة أيام في الشهر.</li><li>الفصل من الخدمة في الحالات التي يحددها النظام، ومن بينها الحالات المنصوص عليها في المادة (80) من نظام العمل.</li></ul><p><strong>أما في دولة الإمارات العربية المتحدة، ووفقاً للمادة (39) من قانون العمل:</strong></p><p>فيجوز توقيع جزاءات تأديبية تشمل:</p><ul><li>لفت نظر كتابي.</li><li>إنذار كتابي يُوثّق في ملف الموظف.</li><li>خصم من الأجر بما لا يجاوز أجر خمسة أيام في الشهر الواحد.</li><li>الإيقاف عن العمل لمدة لا تزيد على أربعة عشر يوماً مع الحرمان من أجر تلك المدة.</li><li>في المنشآت التي تُطبّق نظام العلاوات والترقيات: الحرمان من العلاوة الدورية لمدة لا تزيد على سنة، أو الحرمان من الترقية لمدة لا تزيد على عامين.</li><li>الفصل من الخدمة، مع حفظ حق العامل في مكافأة نهاية الخدمة وفقاً لأحكام القانون.</li></ul><p>وتُطبّق جميع الجزاءات وفق الضوابط والإجراءات القانونية المعتمدة في كل دولة.</p><p><strong>بخصوص الموظفين الدوليين:</strong></p><p>يجوز للشركة توقيع جزاءات تأديبية على الموظف عند مخالفته لواجباته الوظيفية أو أنظمة العمل المعتمدة. وتتنوع الجزاءات التأديبية بحسب جسامة المخالفة، وتشمل:</p><ul><li>الإنذار.</li><li>الخصم من الأجر بما لا يجاوز أجر خمسة أيام في الشهر الواحد.</li><li>تأجيل العلاوة الدورية لمدة لا تجاوز ثلاثة أشهر، أو الحرمان من جزء منها بما لا يجاوز نصفها.</li><li>تأجيل الترقية لمدة لا تزيد على سنة.</li><li>خفض الأجر بمقدار علاوة واحدة على الأكثر.</li><li>الخفض إلى وظيفة في الدرجة الأدنى مباشرة دون الإخلال بالأجر الذي كان يتقاضاه.</li><li>الفصل من الخدمة وفقاً للضوابط والإجراءات القانونية المعمول بها.</li></ul>","bodyEn":"<p><strong>Under the Labor Law of the Kingdom of Saudi Arabia:</strong></p><p>The Company may impose disciplinary penalties on an employee who violates regulations or breaches job duties, provided that the employee is investigated and notified in writing of the imposed penalty. Such penalties may include:</p><ul><li>A written warning.</li><li>A fine through salary deduction not exceeding five days' wages per month.</li><li>Withholding or postponement of the annual increment for a period not exceeding one year.</li><li>Postponement of promotion for a period not exceeding one year.</li><li>Suspension from work for a period not exceeding five days with deprivation of wages not exceeding five days per month.</li><li>Termination of employment in cases specified by law, including those stipulated under Article (80) of the Labor Law.</li></ul><p><strong>In the United Arab Emirates, pursuant to Article (39) of the Labor Law:</strong></p><p>Disciplinary penalties may include:</p><ul><li>A written notice (attention letter).</li><li>Written warning recorded in the employee's file.</li><li>Deduction from wages not exceeding five days' wages per month.</li><li>Suspension from work for a period not exceeding fourteen days with deprivation of wages for that period.</li><li>In establishments applying an increment or promotion system: deprivation of the periodic increment for a period not exceeding one year, or deprivation of promotion for a period not exceeding two years.</li><li>Termination of employment, while preserving the employee's right to end-of-service gratuity in accordance with the law.</li></ul><p>All penalties shall be applied in line with the legal procedures and regulations applicable in each respective country.</p><p><strong>With respect to international employees:</strong></p><p>The Company may impose disciplinary penalties on an employee who violates job duties or the approved workplace regulations. The disciplinary measures vary depending on the severity of the violation and may include:</p><ul><li>Warning.</li><li>Deduction from wages not exceeding five days' salary per month.</li><li>Postponement of the periodic increment for a period not exceeding three months, or deprivation of part of the increment not exceeding half thereof.</li><li>Postponement of promotion for a period not exceeding one year.</li><li>Reduction of salary by no more than the value of one increment.</li><li>Demotion to a position in the immediately lower grade without affecting the salary previously received.</li><li>Termination of employment in accordance with the applicable legal procedures and regulations.</li></ul>","keys":"جزاءات تأديبية غرامة ايقاف فصل disciplinary penalties fine suspension dismissal","facts":[{"kAr":"أقصى خصم شهري","kEn":"Max monthly fine","v":"5","uAr":"أيام من الأجر","uEn":"days' wages"},{"kAr":"الإيقاف (السعودية)","kEn":"Suspension (KSA)","v":"5","uAr":"أيام","uEn":"days"},{"kAr":"الإيقاف (الإمارات)","kEn":"Suspension (UAE)","v":"14","uAr":"يوماً","uEn":"days"}],"pointsAr":["لا يُوقَّع جزاء إلا <b>بعد التحقيق</b> مع الموظف و<b>إخطاره كتابياً</b> بالجزاء.","<b>السعودية:</b> إنذار كتابي · غرامة لا تجاوز <b>أجر 5 أيام شهرياً</b> · حرمان أو تأجيل العلاوة حتى سنة · تأجيل الترقية حتى سنة · إيقاف حتى <b>5 أيام</b> · الفصل في حالات النظام ومنها المادة (80).","<b>الإمارات (المادة 39):</b> لفت نظر · إنذار كتابي · خصم لا يجاوز أجر 5 أيام شهرياً · إيقاف حتى <b>14 يوماً</b> · حرمان من العلاوة حتى سنة أو الترقية حتى سنتين · الفصل مع <b>حفظ حق المكافأة</b>.","<b>الموظفون الدوليون:</b> إنذار · خصم حتى 5 أيام · تأجيل العلاوة حتى 3 أشهر أو الحرمان من نصفها · تأجيل الترقية حتى سنة · خفض الأجر بعلاوة واحدة · الخفض لدرجة أدنى · الفصل."],"pointsEn":["No penalty may be imposed without an <b>investigation</b> and <b>written notice</b> to the employee.","<b>KSA:</b> written warning · fine up to <b>5 days' wages per month</b> · withholding/postponing the annual increment up to a year · postponing promotion up to a year · suspension up to <b>5 days</b> · dismissal in the cases set by law including Article 80.","<b>UAE (Art. 39):</b> attention letter · written warning · deduction up to 5 days' wages per month · suspension up to <b>14 days</b> · loss of increment up to a year or promotion up to two years · dismissal <b>preserving gratuity</b>.","<b>International:</b> warning · deduction up to 5 days · increment postponed up to 3 months or halved · promotion postponed up to a year · pay reduced by one increment · demotion · dismissal."]}]},{"id":"s11","no":"11","ar":"إنهاء الخدمة","en":"Termination of Employment","policies":[{"id":"s11-0","ref":"11","ar":"إنهاء الخدمة","en":"Termination of Employment","bodyAr":"<p>في حال رغبة الموظف في الاستقالة، يتعيّن عليه تقديم إخطار كتابي إلى مديره المباشر، وذلك وفقاً لمدة الإخطار المنصوص عليها في عقد العمل.</p><p>وفي حال قررت Approach إنهاء خدمة الموظف، سيتم إخطار الموظف كتابياً بهذا القرار، وذلك عبر القنوات الرسمية المعتمدة، بما في ذلك المنصات الحكومية المعنية.</p><p>ووفقاً لعقد العمل، تبلغ مدة الإخطار القانونية بحسب ما هو منصوص عليه بالعقد. ويجوز للشركة، وفق تقديرها، صرف مقابل مالي بدلاً عن مدة الإخطار.</p><p>يتم إعداد وإصدار مستند التسوية النهائية في اليوم الأخير من عمل الموظف، ولا يمكن طلبه قبل ذلك، نظراً لارتباطه بعناصر أساسية -مثل رصيد الإجازات المتبقية، والاستقطاعات، وأي تسويات مالية أخرى- والتي لا يمكن التحقق منها بدقة إلا في تلك المرحلة. ويتم صرف المستحقات النهائية في آخر يوم عمل للموظف.</p><p><strong>فيما يلي مجموعة من الإرشادات:</strong></p><ul><li><strong>توقيت المغادرة:</strong> يُحدّد توقيت مغادرة الموظف إما بشكل فوري أو في آخر يوم عمل، وذلك بحسب عوامل مثل: مدة الإخطار، أو الفترة المتبقية من علاقة العمل مع الشركة.</li><li><strong>الأنظمة:</strong> في حال استمرار الموظف في العمل لعدة أسابيع بعد تقديم الاستقالة، يظل مفعّلاً على أنظمة الشركة طوال تلك الفترة.</li><li><strong>إعادة ممتلكات الشركة:</strong> عند مغادرة ابروتش يتعين على الموظف إعادة جميع ممتلكات الشركة، بما في ذلك -على سبيل المثال لا الحصر- الهاتف المحمول، وجهاز الحاسوب المحمول، والمستندات. وفي حال عدم إعادة أي من هذه الممتلكات، يجوز خصم قيمتها من المستحقات المالية النهائية للموظف.</li></ul><p>تهدف هذه الإجراءات إلى ضمان حماية المعلومات الحساسة، والتأكد من حصر واسترداد أصول الشركة بشكل كامل.</p>","bodyEn":"<p>If an Employee wishes to resign, they must give the required written notice to their line manager as stated in their contract of employment.</p><p>In the event that Approach decides to terminate an employee's service, the employee shall be formally notified in writing, through the official approved channels, including the relevant government platforms.</p><p>As per Employee Contract, the legal notice timeframe is as agreed upon in the contract. Approach may give the equivalent pay in lieu of notice.</p><p>The final settlement document will be prepared and issued during the employee's final day of employment. It cannot be requested earlier, as essential details—such as remaining leave balances, deductions, and other financial adjustments—can only be accurately verified at that stage. The final payment will be processed on the employee's last working day.</p><p><strong>Here are some guidelines:</strong></p><ul><li><strong>Departure Timing:</strong> Employees should leave either immediately or on their last day, depending on factors such as notice period or the duration of their remaining time with the company.</li><li><strong>System Access:</strong> If an employee stays for a few weeks after giving notice, they should remain on our systems during that period.</li><li><strong>Returning Company Equipment:</strong> On leaving Approach, the Employee must return all items of Approach's property eg. Mobile phone, laptop, documentation. Failure to do so may incur a deduction from the Employee's final salary payment.</li></ul><p>This practice ensures that sensitive information is properly secured and that the company's assets are accounted for.</p>","keys":"استقالة انهاء خدمة اخطار تسوية نهائية resignation termination notice final settlement","facts":[{"kAr":"التسوية النهائية","kEn":"Final settlement","v":"آخر يوم عمل","uAr":"","uEn":"","vEn":"Last working day"},{"kAr":"مدة الإخطار","kEn":"Notice period","v":"حسب العقد","uAr":"","uEn":"","vEn":"As per contract"}],"pointsAr":["الاستقالة تكون بـ<b>إخطار كتابي</b> للمدير المباشر وفق <b>مدة الإخطار في عقد العمل</b>.","عند إنهاء الشركة للخدمة يُخطَر الموظف <b>كتابياً عبر القنوات الرسمية</b> بما فيها <b>المنصات الحكومية</b>.","للشركة صرف <b>مقابل مالي بدلاً عن مدة الإخطار</b> بتقديرها.","<b>التسوية النهائية</b> تُعد وتُصرف في <b>آخر يوم عمل</b> ولا يمكن طلبها قبل ذلك لارتباطها برصيد الإجازات والاستقطاعات.","يجب <b>إعادة جميع ممتلكات الشركة</b> (الجوال، اللابتوب، المستندات)، وإلا خُصمت قيمتها من المستحقات النهائية."],"pointsEn":["Resignation requires <b>written notice</b> to your line manager per the <b>contractual notice period</b>.","If the Company terminates, you are notified <b>in writing through official channels</b> including <b>government platforms</b>.","The Company may pay <b>in lieu of notice</b> at its discretion.","The <b>final settlement</b> is prepared and paid on the <b>last working day</b> and cannot be requested earlier.","<b>All Company property</b> (phone, laptop, documents) must be returned, or its value is deducted from the final payment."]}]},{"id":"s12","no":"12","ar":"مدونة سلوك وأخلاقيات العمل","en":"Ethics","policies":[{"id":"s12-0","ref":"12","ar":"مدونة سلوك وأخلاقيات العمل","en":"Ethics","bodyAr":"<p>بصفتنا شركة واحدة، نلتزم بالحفاظ على أعلى المعايير الأخلاقية في جميع أنشطتنا وممارساتنا التجارية.</p><p>تُعد سمعتنا أحد أهم أصولنا، كما أن الحفاظ على الثقة والمصداقية لدى جميع الأطراف التي نتعامل معها يُمثل إحدى مسؤولياتنا الجوهرية. وبناءً عليه، يجب أن تُستخدم قيمنا الأساسية كمرجع يوجّه ويحدّد أسلوب عملنا في جميع عملياتنا.</p><p>نُقر بمسؤوليتنا تجاه جميع الأطراف ذات العلاقة، بما في ذلك المساهمون والموظفون والعملاء والموردون والمنافسون والمجتمع ككل. وانطلاقاً من ذلك، تضع هذه المدونة المبادئ العامة والإرشادات الأساسية للممارسات الواجب اتباعها على مستوى الشركة.</p><p>ويُطلب من كل موظف ضمن الشركة اعتماد المبادئ والإجراءات المناسبة لمعالجة القضايا الأخلاقية الخاصة التي قد تنشأ وفقاً لظروفه وطبيعة عمله.</p><p>كما تلتزم الشركة بمراجعة ومتابعة الأداء الأخلاقي بشكل دوري، بما يضمن القضاء على أي ممارسات تجارية فاسدة أو غير أخلاقية.</p><p><strong>الصلاحيات الوظيفية والواجبات:</strong></p><p>يُتوقع من جميع الموظفين أداء واجباتهم ومسؤولياتهم المهنية بنزاهة وأمانة. كما يُنتظر منهم التحلي بالصدق في تعاملهم مع أصحاب المصلحة، والعملاء، والمجتمع. ويتعين على المديرين والمشرفين احترام مرؤوسيهم وأعضاء فرقهم، وتوزيع المهام بما يتناسب مع كفاءات الموظفين وحجم أعبائهم الوظيفية. وفي المقابل، يُتوقع من أعضاء الفريق الالتزام بتوجيهات مديريهم واتباع التعليمات الصادرة عنهم، بما يسهم في إنجاز المهام بكفاءة وفي الوقت المحدد.</p><p><strong>تعارض المصالح:</strong></p><p>يجب على الموظفين تجنب أي مصالح مالية أو شخصية أو غيرها قد تؤثر سلباً على حيادهم أو قدرتهم على أداء واجباتهم الوظيفية على النحو الأمثل. يحق للشركة أن تطلب من الموظف توقيع وثيقة مستقلة يتعهد بموجبها بعدم وجود أو ممارسة أي تعارض مصالح، وذلك في الحالات التي تنطوي على مسؤوليات حساسة.</p><p><strong>التعاون:</strong></p><p>يُتوقع من جميع الموظفين التحلي بروح التعاون والود داخل بيئة العمل، وبذل كل جهد ممكن للحفاظ على الانسجام والسلام المهني في مكان العمل.</p><p><strong>التواصل:</strong></p><p>يجب على جميع الموظفين أن يكونوا منفتحين على التواصل مع مديريهم وأعضاء فرقهم وزملائهم.</p><p><strong>المزايا:</strong></p><p>يجب على الموظفين عدم إساءة استخدام المزايا الوظيفية الممنوحة لهم، مثل التأمين، والإجازات، أو أي تسهيلات أخرى تقدمها الشركة.</p><p><strong>السياسات:</strong></p><p>نتوقع من جميع الموظفين قراءة والالتزام بمدونة سلوكيات الموظفين المعتمدة لدى الشركة. ويمكن للموظفين الرجوع إلى إدارة الموارد البشرية أو مديريهم المباشرين، في حال وجود أي استفسارات أو مخاوف.</p>","bodyEn":"<p>As a Group we should maintain the highest ethical standards in carrying out our business activities.</p><p>Our reputation is one of our most important assets. Maintaining the trust and confidence of all those whom we deal with is accordingly one of our most vital responsibilities, so in all our operations, our set of core values must be used to guide and direct the way we do business.</p><p>We recognise our obligations to those with whom we have dealings – shareholders, employees, customers, suppliers, competitors and the wider community. Accordingly this code sets overall principles and guidelines for practice to be adopted throughout the Group.</p><p>Individual businesses within the Group are required to adopt appropriate principles and processes to deal with specific ethical issues that arise in their specific circumstances.</p><p>We will monitor ethical performance regularly in order to ensure that corrupt or unethical business practices are eliminated.</p><p><strong>Job Authority And Duties:</strong></p><p>All employees are expected to fulfill their professional duties and responsibilities with integrity. They should be honest while dealing with stakeholders, consumers and the community. Managers and supervisors should respect their juniors and team members. They must distribute duties according to the proficiencies and workload of the employees. On the same note, team members should also obey and follow the instructions of their managers. It will help them in completing their duties skillfully and on time.</p><p><strong>Conflict Of Interest:</strong></p><p>Employees must avoid any financial, personal or other interests that may hinder their willingness or capabilities to perform their duties. The Company reserves the right to require the employee to sign a separate declaration confirming the absence of any conflict of interest, particularly in roles involving sensitive responsibilities.</p><p><strong>Collaboration:</strong></p><p>All the employees should be collaborative and friendly at the workplace. They should make every possible effort to maintain peace and harmony at the workplace.</p><p><strong>Communication:</strong></p><p>All the employees should be open to communication with their managers, team members and colleagues.</p><p><strong>Benefits:</strong></p><p>Employees should not misuse their employment benefits like insurance, time off and other facilities.</p><p><strong>Policies:</strong></p><p>We expect all employees to read and adhere to our code of ethics for employees. They can turn to the Human Resource Department or their managers for any queries and concerns.</p>","keys":"اخلاقيات سلوك نزاهة ethics code of conduct","pointsAr":["الحفاظ على <b>أعلى المعايير الأخلاقية</b> في كل الأنشطة؛ السمعة من أهم أصول الشركة.","<b>الصلاحيات والواجبات:</b> أداء المهام بنزاهة وصدق مع أصحاب المصلحة، واحترام المدراء لمرؤوسيهم وتوزيع المهام وفق الكفاءة وحجم العمل.","<b>تعارض المصالح:</b> تجنب أي مصلحة تؤثر على الأداء، وللشركة طلب <b>إقرار مستقل</b> بعدم التعارض في الأدوار الحساسة.","<b>التعاون والتواصل:</b> الحفاظ على الانسجام في بيئة العمل والانفتاح على التواصل مع المدراء والزملاء.","<b>المزايا:</b> عدم إساءة استخدام التأمين أو الإجازات أو أي تسهيلات تمنحها الشركة."],"pointsEn":["Maintain the <b>highest ethical standards</b> in all activities; our reputation is among our most important assets.","<b>Authority and duties:</b> act with integrity and honesty toward stakeholders; managers respect their teams and allocate work by proficiency and workload.","<b>Conflict of interest:</b> avoid any interest that hinders your duties; the Company may require a <b>separate declaration</b> in sensitive roles.","<b>Collaboration and communication:</b> keep harmony at the workplace and stay open with managers and colleagues.","<b>Benefits:</b> do not misuse insurance, time off or any Company facility."]}]},{"id":"ack","no":"","ar":"إقرار استلام الدليل","en":"Acknowledgment of Receipt","policies":[{"id":"ack-1","ref":"","ar":"إقرار استلام الدليل","en":"Acknowledgment of Receipt","bodyAr":"<p><strong>لأغراض التوثيق، يُرجى استكمال البيانات أدناه وإعادتها إلى مدير إدارة الموارد البشرية، وذلك لتأكيد استلام نسخة من دليل الموظف.</strong></p><p><strong>إلى: مدير إدارة الموارد البشرية</strong></p><p>أقر بموجب هذا باستلام نسخة من دليل الموظف الخاص بشركة أبروتش. أفهم وأوافق على أن السياسات والإجراءات والقواعد الواردة في دليل الموظف -حيثما نُص على ذلك- تُعد جزءاً لا يتجزأ من عقد العمل المبرم بيني وبين شركة ابروتش.</p><p><strong>الاسم:</strong> ....................................................</p><p><strong>التوقيع:</strong> ..................................................</p><p><strong>التاريخ:</strong> ..................................................</p>","bodyEn":"<p><strong>For record purposes, please complete the below and return it to the HR Director to acknowledge receipt of your copy of the Employee Handbook.</strong></p><p><strong>To: The HR Director</strong></p><p>I hereby acknowledge receipt of a copy of the Approach Employee Handbook. I understand and accept that, where specified, the policies, procedures and rules contained in the Employee Handbook form part of my contract of employment with Approach.</p><p><strong>Name:</strong> ....................................................</p><p><strong>Signed:</strong> ..................................................</p><p><strong>Date:</strong> ....................................................</p>"}]},{"id":"ap1","no":"م1","ar":"الملحق (1): الحضور وساعات العمل","en":"Appendix 1: Attendance & Working Hours","policies":[{"id":"ap1-1","ref":"م1","ar":"سياسة الحضور وساعات العمل وفقاً لنظام العمل السعودي","en":"Attendance & Working Hours Policy (Saudi Labor Law)","bodyAr":"<ul><li>تخضع ساعات العمل لأحكام نظام العمل السعودي واللوائح ذات الصلة. ويكون الدوام الرسمي من الساعة 9:00 صباحاً حتى 5:00 مساءً، بواقع ثماني (8) ساعات عمل يومياً وبحد أقصى ثمانية وأربعون (48) ساعة عمل أسبوعياً، ما لم يتم اعتماد ما هو خلاف ذلك.</li></ul><ul><li>تسمح الشركة بهامش مرونة محدود للتأخر أو التبكير في الحضور أو الانصراف المبكر، بحد أقصى ساعة يومياً، على أن يتم استكمال عدد ساعات العمل المطلوبة خلال اليوم نفسه.</li></ul><ul><li>في حال تجاوز التأخر مدة ساعة، يُحتسب اليوم غياباً، ويتم خصمه من رصيد الإجازات السنوية أو احتسابه إجازة بدون أجر، وذلك وفقاً لنظام العمل السعودي.</li></ul><ul><li>يجب الحصول على موافقة مسبقة من المدير المباشر على أي عمل يتم خارج مقر الشركة، مع توضيح طبيعة المهمة ومدتها، ويُؤخذ ذلك في الاعتبار عند مراجعة الحضور وساعات العمل.</li></ul><ul><li>يجب تقديم طلبات الاستئذان (التأخر، الانصراف المبكر، أو الغياب) عبر قنوات التواصل المعتمدة والتي تشمل واتساب. ولا يُعد قبول الطلب استثناءً من القواعد المنظمة للحضور وساعات العمل الواردة في هذه السياسة.</li></ul><ul><li>في حالات الغياب الطارئ، يلتزم الموظف بإخطار الشركة في الساعتين الأولى من اليوم نفسه. ولا يُعفي الغياب الطارئ الموظف من التزاماته الوظيفية، ولا يجوز أن يؤثر سلباً على متطلبات العمل العاجلة.</li></ul><ul><li>يلتزم جميع الموظفين بتسجيل الحضور والانصراف يومياً عبر ZenHR باعتباره النظام الرسمي المعتمد لدى الشركة لإدارة الحضور والإجازات والدوام الإضافي. وتُعد سجلات ZenHR المرجع الرسمي عند أي نزاع أو مراجعة تتعلق بالحضور. وتُقدّم جميع طلبات الاستئذان والغياب والإجازات عبر النظام ذاته. وفي حال عدم تسجيل الحضور لأي سبب، يجب إبلاغ المدير المباشر وإدارة الموارد البشرية فوراً وتسجيل الاستثناء عبر ZenHR.</li></ul>","bodyEn":"<ul><li>Working hours are determined in accordance with the Saudi Labor Law and applicable regulations. The standard working schedule is from 9:00 AM to 5:00 PM, totaling eight (8) working hours per day and a maximum of forty-eight (48) working hours per week, unless otherwise approved.</li></ul><ul><li>The Company allows limited flexibility for late or early arrival or early departure of up to one (1) hour per day, provided that the total required working hours are completed on the same working day.</li></ul><ul><li>If an employee is late for more than one (1) hour, the day shall be considered an absence, and will be deducted from the employee's annual leave balance or treated as unpaid leave, in accordance with the Saudi Labor Law.</li></ul><ul><li>Any work performed outside the Company premises must be pre-approved by the direct manager and clearly communicated, including the nature of the task and duration. Such time may be considered during attendance and working hours review.</li></ul><ul><li>Requests for permission (late arrival, early departure, or absence) must be communicated through the approved communication channels like WhatsApp. Approval of such requests does not override the attendance and working hours rules set forth in this policy.</li></ul><ul><li>In cases of emergency absence, employees must notify the Company within the first two hours of the same working day. Emergency absence does not exempt the employee from work obligations and must not negatively impact urgent business or client requirements.</li></ul><ul><li>All employees are required to record their daily attendance and departure through the ZenHR application, which is the Company's officially approved system for managing attendance, leave, and overtime. ZenHR records shall serve as the official reference in any dispute or review related to attendance. All requests for permission, absence and leave must be submitted through the same system. In the event that attendance is not recorded for any reason, the direct manager and Human Resources Department must be notified immediately, and the exception must be logged through ZenHR.</li></ul>","keys":"ملحق حضور دوام مرونة ساعة غياب طارئ appendix attendance grace emergency","facts":[{"kAr":"الدوام الرسمي","kEn":"Official hours","v":"9:00 – 17:00","uAr":"","uEn":""},{"kAr":"هامش المرونة","kEn":"Flexibility margin","v":"1","uAr":"ساعة يومياً","uEn":"hour per day"},{"kAr":"تجاوز التأخر ساعة","kEn":"Late beyond 1 hour","v":"غياب","uAr":"يُخصم من الإجازة","uEn":"deducted from leave","vEn":"Absence"},{"kAr":"إخطار الغياب الطارئ","kEn":"Emergency absence notice","v":"2","uAr":"ساعة من بداية اليوم","uEn":"hours from day start"}],"pointsAr":["الدوام الرسمي <b>9:00 صباحاً – 5:00 مساءً</b>، ثماني ساعات يومياً وبحد أقصى 48 ساعة أسبوعياً.","هامش مرونة <b>حتى ساعة واحدة يومياً</b> للتأخر أو الانصراف المبكر، <b>بشرط استكمال ساعات العمل في اليوم نفسه</b>.","تجاوز التأخر <b>ساعة واحدة</b> يجعل اليوم <b>غياباً</b> يُخصم من <b>رصيد الإجازة السنوية</b> أو يُعد <b>بدون أجر</b>.","أي عمل خارج المقر يحتاج <b>موافقة مسبقة</b> من المدير المباشر مع بيان طبيعة المهمة ومدتها.","طلبات الاستئذان تُقدَّم عبر القنوات المعتمدة ومنها <b>واتساب</b>، وقبولها <b>لا يُعد استثناءً</b> من قواعد الحضور.","<b>الغياب الطارئ:</b> إخطار الشركة خلال <b>أول ساعتين</b> من اليوم نفسه، ولا يُعفي ذلك من التزامات العمل العاجلة.","<b>سجلات ZenHR هي المرجع الرسمي</b> عند أي نزاع أو مراجعة تتعلق بالحضور."],"pointsEn":["Official hours are <b>9:00 AM – 5:00 PM</b>, eight hours a day, maximum 48 hours a week.","A flexibility margin of <b>up to one hour per day</b> for late arrival or early departure, <b>provided the required hours are completed the same day</b>.","Lateness beyond <b>one hour</b> makes the day an <b>absence</b>, deducted from <b>annual leave</b> or treated as <b>unpaid</b>.","Any work outside the premises needs <b>prior approval</b> from the line manager, stating the task and its duration.","Permission requests go through approved channels including <b>WhatsApp</b>; approval <b>does not override</b> the attendance rules.","<b>Emergency absence:</b> notify the Company within the <b>first two hours</b> of the same day; this does not exempt you from urgent work obligations.","<b>ZenHR records are the official reference</b> in any attendance dispute or review."]}]},{"id":"ap2","no":"م2","ar":"الملحق (2): سياسات أسواق العمل","en":"Appendix 2: Labor Market Policies","policies":[{"id":"ap2-1","ref":"م2.1","ar":"المملكة العربية السعودية","en":"Saudi Arabia","bodyAr":"","bodyEn":"","table":[{"k":"الإجازة السنوية","ar":"<p>يستحق الموظفون إجازة سنوية مدتها واحد وعشرون (21) يوماً لمن تقل مدة خدمتهم في الشركة عن خمس (5) سنوات، وثلاثون (30) يوماً لمن تزيد خدمتهم عن خمس (5) سنوات.</p>","en":"<p><strong>Annual Leave:</strong> Employees are entitled to twenty-one (21) days of annual leave if their length of service in the company is less than five (5) years, and thirty (30) days of annual leave if their length of service exceeds five (5) years.</p>"},{"k":"فترة التجربة","ar":"<p>تمتد فترة التجربة لمدة تصل إلى ستة (6) أشهر.</p>","en":"<p><strong>Probation Period:</strong> The probation period may extend up to six (6) months.</p>"},{"k":"الإجازة المرضية","ar":"<p>تُمنح الإجازة المرضية على النحو التالي:</p><ul><li>من (0) إلى (30) يوماً: بأجر كامل.</li><li>من (31) إلى (90) يوماً: بنسبة 75% من الأجر.</li><li>من (91) إلى (120) يوماً: بدون أجر.</li></ul>","en":"<p><strong>Sick Leave:</strong> Sick leave is granted as follows: from zero (0) to thirty (30) days with full pay; from thirty-one (31) to ninety (90) days with seventy-five percent (75%) of the salary; and from ninety-one (91) to one hundred and twenty (120) days without pay.</p>"},{"k":"إجازة الوضع (الأمومة)","ar":"<p>يحق للموظفات الحصول على إجازة وضع لمدة اثني عشر (12) أسبوعاً بأجر كامل، على أن تكون ستة (6) أسابيع منها بعد الولادة إلزامية.</p>","en":"<p><strong>Maternity Leave:</strong> Female employees are entitled to twelve (12) weeks of maternity leave with full pay, of which six (6) weeks after delivery are mandatory.</p>"},{"k":"إجازة الأبوة","ar":"<p>يحق للموظفين الذكور الحصول على إجازة أبوة لمدة ثلاثة (3) أيام.</p>","en":"<p><strong>Paternity Leave:</strong> Male employees are entitled to three (3) days of paternity leave.</p>"},{"k":"إجازة الزواج","ar":"<p>يحق للموظف الحصول على إجازة زواج لمدة خمسة (5) أيام.</p>","en":"<p><strong>Marriage Leave:</strong> Employees are entitled to five (5) days of marriage leave.</p>"},{"k":"إجازة الوفاة (التعزية)","ar":"<p><strong>للذكور:</strong> خمسة (5) أيام في حالة وفاة أحد الوالدين أو الأبناء، وثلاثة (3) أيام في حالة وفاة الإخوة أو الأقارب.</p><p><strong>للإناث:</strong> أربعة (4) أشهر وعشرة (10) أيام للموظفات المسلمات في حالة وفاة الزوج، وخمسة عشر (15) يوماً للموظفات غير المسلمات في حالة وفاة الزوج.</p><p><em>يحق للشركة طلب شهادة الوفاة عند الاقتضاء.</em></p>","en":"<p><strong>Compassionate Leave:</strong></p><ul><li><strong>For male employees:</strong> Five (5) days in the event of the death of a parent or child, and three (3) days in the event of the death of siblings or relatives.</li><li><strong>For female employees:</strong> Four (4) months and ten (10) days for Muslim employees in the event of the death of a spouse, and fifteen (15) days for non-Muslim employees in the event of the death of a spouse.</li></ul><p><em>The Company reserves the right to request a death certificate, where applicable.</em></p>"},{"k":"مكافأة نهاية الخدمة","ar":"<p>تُحتسب مكافأة نهاية الخدمة بنصف أجر شهر عن كل سنة من السنوات الخمس الأولى، وأجر شهر كامل عن كل سنة من السنوات التالية.</p>","en":"<p><strong>Gratuity Calculation:</strong> End-of-service gratuity shall be calculated as half a month's wage for each of the first five (5) years of service, and one month's wage for each subsequent year.</p>"}],"keys":"السعودية اجازة سنوية 21 30 مرضية وفاة زواج مكافأة saudi annual leave gratuity","facts":[{"kAr":"إجازة سنوية (أقل من 5 سنوات)","kEn":"Annual leave (<5 yrs)","v":"21","uAr":"يوماً","uEn":"days"},{"kAr":"إجازة سنوية (أكثر من 5 سنوات)","kEn":"Annual leave (>5 yrs)","v":"30","uAr":"يوماً","uEn":"days"},{"kAr":"فترة التجربة","kEn":"Probation","v":"6","uAr":"أشهر","uEn":"months"}]},{"id":"ap2-2","ref":"م2.2","ar":"الموظفون الدوليون","en":"International Employees","bodyAr":"","bodyEn":"","table":[{"k":"الإجازة السنوية","ar":"<p>يستحق الموظف إجازة سنوية مدتها أربعة عشر (14) يوماً تقويمياً.</p>","en":"<p><strong>Annual Leave:</strong> Employees are entitled to fourteen (14) calendar days of annual leave.</p>"},{"k":"فترة التجربة","ar":"<p>تبلغ فترة التجربة ثلاثة (3) أشهر.</p>","en":"<p><strong>Probation Period:</strong> The probation period is three (3) months.</p>"},{"k":"الإجازة المرضية","ar":"<p>تُمنح الإجازة المرضية على النحو التالي: أجر كامل لأول خمسة عشر (15) يوماً، وتكون الإجازة غير مدفوعة الأجر للأيام التالية.</p>","en":"<p><strong>Sick Leave:</strong> Sick leave is granted as follows: full pay for the first fifteen (15) days, unpaid for the remaining days.</p>"},{"k":"إجازة الوضع (الأمومة)","ar":"<p>يحق للموظفات الحصول على إجازة وضع لمدة اثني عشر (12) أسبوعاً، بواقع أسبوعين (2) بأجر كامل والباقي بدون أجر.</p>","en":"<p><strong>Maternity Leave:</strong> Female employees are entitled to twelve (12) weeks of maternity leave, with two (2) weeks at full pay and the other weeks unpaid.</p>"},{"k":"إجازة الأبوة","ar":"<p>يحق للموظفين الذكور الحصول على إجازة أبوة لمدة يوم واحد (1).</p>","en":"<p><strong>Paternity Leave:</strong> Male employees are entitled to one (1) day of paternity leave.</p>"},{"k":"إجازة الزواج","ar":"<p>يحق للموظف الحصول على إجازة زواج لمدة ثلاثة (3) أيام.</p>","en":"<p><strong>Marriage Leave:</strong> Employees are entitled to three (3) days of marriage leave.</p>"},{"k":"إجازة الوفاة (التعزية)","ar":"<p>يحق للموظف الحصول على إجازة وفاة لمدة ثلاثة (3) أيام في حالة وفاة الأقارب من الدرجة الأولى.</p>","en":"<p><strong>Compassionate Leave:</strong> Employees are entitled to three (3) days of compassionate leave in the case of the death of an immediate family member.</p>"}],"keys":"دولي اجازة 14 يوم تجربة 3 اشهر international annual leave","facts":[{"kAr":"إجازة سنوية","kEn":"Annual leave","v":"14","uAr":"يوماً تقويمياً","uEn":"calendar days"},{"kAr":"فترة التجربة","kEn":"Probation","v":"3","uAr":"أشهر","uEn":"months"},{"kAr":"مرضية بأجر كامل","kEn":"Sick (full pay)","v":"15","uAr":"يوماً","uEn":"days"}]},{"id":"ap2-3","ref":"م2.3","ar":"الإمارات العربية المتحدة","en":"UAE","bodyAr":"","bodyEn":"","table":[{"k":"الإجازة السنوية","ar":"<p>يحق للموظفين في دولة الإمارات العربية المتحدة الحصول على إجازة سنوية مدتها ثلاثون (30) يوماً تقويمياً.</p><p>في حال حصول الموظف على إجازة تبدأ من يوم الأحد وحتى يوم الخميس، تُحتسب أيام العطلة الأسبوعية ضمن مدة الإجازة، على أن تُخصم سبعة أيام من رصيد إجازاته.</p><p>تكون الإجازة الأسبوعية يومي الجمعة والسبت من كل أسبوع.</p>","en":"<p><strong>Annual Leave:</strong> Employees in the UAE are entitled to an annual leave of thirty (30) calendar days.</p><p>If an employee takes leave from Sunday through Thursday, the weekly days off will be counted as part of the leave period, and seven days will be deducted from the employee's leave balance.</p><p>The weekly days off are Friday and Saturday.</p>"},{"k":"فترة التجربة","ar":"<p>تمتد فترة التجربة لمدة تصل إلى ستة (6) أشهر.</p>","en":"<p><strong>Probation Period:</strong> The probation period may extend up to six (6) months.</p>"},{"k":"الإجازة المرضية","ar":"<p>تُمنح الإجازة المرضية على النحو التالي:</p><ul><li>من (0) إلى (15) يوماً: بأجر كامل.</li><li>من (16) إلى (45) يوماً: بنصف الأجر.</li><li>أي فترة تزيد عن (45) يوماً: تكون بدون أجر.</li></ul>","en":"<p><strong>Sick Leave:</strong> Sick leave is granted as follows: from zero (0) to fifteen (15) days with full pay; from sixteen (16) to forty-five (45) days with half pay; and any period exceeding forty-five (45) days sha /* ===================== محرك الحضور والتقارير ===================== */
function isWeekend(d) { var w = cfg().weekend || [5, 6]; return w.indexOf(d.getDay()) > -1; }
function dateList(from, to) {
  var a = [], d = new Date(from + 'T00:00:00'), e = new Date(to + 'T00:00:00');
  while (d <= e) { a.push(ymd(d)); d.setDate(d.getDate() + 1); }
  return a;
}
function leaveOn(empId, ds) {
  var L = leaves(), i;
  for (i = 0; i < L.length; i++) if (L[i].emp === empId && ds >= L[i].from && ds <= L[i].to) return L[i];
  return null;
}
var LEAVE_LBL = {
  annual: ['إجازة سنوية', 'Annual leave'], sick: ['إجازة مرضية', 'Sick leave'],
  wfh: ['عمل من المنزل', 'Work from home'], official: ['إجازة رسمية', 'Public holiday'],
  unpaid: ['إجازة بدون أجر', 'Unpaid leave'], mission: ['مهمة عمل خارجية', 'Field assignment'],
  special: ['إجازة خاصة', 'Special leave']
};
function leaveLbl(t) { var x = LEAVE_LBL[t] || [t, t]; return T(x[0], x[1]); }

/* يبني سجل أيام موظف واحد */
function dayMap(empId) {
  var m = {};
  allPunches().forEach(function (r) {
    if (r.emp !== empId) return;
    var d = r.date || ymd(new Date(r.ts));
    if (!m[d]) m[d] = { ins: [], outs: [], all: [] };
    m[d].all.push(r);
    (r.type === 'in' ? m[d].ins : m[d].outs).push(r);
  });
  for (var d in m) { m[d].ins.sort(function (a, b) { return a.ts - b.ts; }); m[d].outs.sort(function (a, b) { return a.ts - b.ts; }); }
  return m;
}

function evalDay(ds, rec, empId, exempt) {
  var c = cfg(), d = new Date(ds + 'T00:00:00'), today = ymd(new Date());
  var o = { date: ds, status: '', inT: null, outT: null, worked: 0, late: 0, early: 0, ot: 0, short: 0, note: '', count: rec ? rec.all.length : 0 };
  var lv = leaveOn(empId, ds);
  if (isWeekend(d) && !(rec && rec.all.length)) { o.status = 'weekend'; return o; }
  if (lv && !(rec && rec.all.length)) { o.status = 'leave'; o.leave = lv.type; o.note = lv.note || ''; return o; }
  if (!rec || !rec.all.length) { o.status = (ds > today) ? 'future' : 'absent'; return o; }

  var fin = rec.ins[0], lout = rec.outs.length ? rec.outs[rec.outs.length - 1] : null;
  if (fin) o.inT = parseHM(fin.time || hm(new Date(fin.ts)));
  if (lout) o.outT = parseHM(lout.time || hm(new Date(lout.ts)));
  if (lv) { o.leave = lv.type; }

  var st = parseHM(c.start), en = parseHM(c.end), need = (+c.hours) * 60, grace = +c.grace;

  if (o.inT === null) { o.status = 'missing'; o.note = T('لا يوجد تسجيل دخول', 'No check-in'); return o; }
  if (o.outT === null) { o.status = 'missing'; o.note = T('لا يوجد تسجيل خروج', 'No check-out'); o.late = Math.max(0, o.inT - st); return o; }

  o.worked = Math.max(0, o.outT - o.inT);
  o.late = Math.max(0, o.inT - st);
  o.early = Math.max(0, en - o.outT);
  if (o.worked > need) o.ot = o.worked - need; else o.short = need - o.worked;

  if (isWeekend(d)) { o.status = 'weekendwork'; o.ot = o.worked; o.short = 0; return o; }
  if (!exempt && o.late > grace) { o.status = 'lateAbs'; return o; }
  if (o.late > 0) { o.status = 'late'; return o; }
  o.status = 'present'; return o;
}

var ST_LBL = {
  present: ['حاضر', 'Present', 'b-ok'], late: ['تأخر ضمن المرونة', 'Late (within grace)', 'b-warn'],
  lateAbs: ['تأخر يتجاوز الساعة — يُحتسب غياباً', 'Late > 1h — counted absent', 'b-bad'],
  missing: ['بصمة ناقصة', 'Missing punch', 'b-warn'], absent: ['غياب', 'Absent', 'b-bad'],
  weekend: ['عطلة أسبوعية', 'Weekend', 'b-mute'], weekendwork: ['عمل في العطلة', 'Weekend work', 'b-info'],
  leave: ['إجازة', 'Leave', 'b-info'], future: ['—', '—', 'b-mute']
};
function stLbl(o) {
  if (o.status === 'leave') return { t: leaveLbl(o.leave), c: 'b-info' };
  var x = ST_LBL[o.status] || ['', '', 'b-mute'];
  return { t: T(x[0], x[1]), c: x[2] };
}

function report(empId, from, to) {
  var e = empBy(empId) || {}, exempt = !!e.exempt, m = dayMap(empId);
  var days = dateList(from, to).map(function (ds) { return evalDay(ds, m[ds], empId, exempt); });
  var t = { work: 0, present: 0, late: 0, lateAbs: 0, absent: 0, missing: 0, leave: 0, weekend: 0, worked: 0, ot: 0, short: 0, need: 0 };
  days.forEach(function (o) {
    if (o.status === 'weekend') { t.weekend++; return; }
    if (o.status === 'future') return;
    if (o.status === 'weekendwork') { t.worked += o.worked; t.ot += o.ot; return; }
    t.work++; t.need += (+cfg().hours) * 60;
    t.worked += o.worked; t.ot += o.ot; t.short += o.short;
    if (o.status === 'leave') { t.leave++; t.need -= (+cfg().hours) * 60; t.work--; }
    else if (o.status === 'present') t.present++;
    else if (o.status === 'late') { t.present++; t.late++; }
    else if (o.status === 'lateAbs') { t.lateAbs++; t.absent++; }
    else if (o.status === 'missing') { t.missing++; t.present++; if (o.late > +cfg().grace) t.lateAbs++; else if (o.late > 0) t.late++; }
    else if (o.status === 'absent') t.absent++;
  });
  return { days: days, t: t };
}

  }, 1000);
}

  var n = new Date();
  var c = cfg();
  var st = stLbl(o);
  var unsy = punches().filter(function (r) { return !r.synced; }).length;

  /* ملخص الشهر الجاري */
  var mf = ymd(new Date(n.getFullYear(), n.getMonth(), 1)), mt = ymd(new Date(n.getFullYear(), n.getMonth() + 1, 0));
  var R = report(m.id, mf, mt);

  var left = '<div class="panel">' +

/* --------- تنفيذ البصمة --------- */
function punch(type, whenISO, note) {
  var m = me(); if (!m) { go('#/punch'); return; }
  var d = whenISO ? new Date(whenISO) : new Date();
  var rec = {
    id: m.id + '-' + d.getTime() + '-' + Math.random().toString(36).substr(2, 5),
    emp: m.id, name: m.name, type: type, ts: d.getTime(), date: ymd(d), time: hm(d),
    note: note || '', dev: devId(), synced: 0
  };
  addPunch(rec);
  toast(T(type === 'in' ? 'تم تسجيل الدخول ' : 'تم تسجيل الخروج ', (type === 'in' ? 'Checked in ' : 'Checked out ')) + hm(d), 'ok');
  render();
  syncUp(function (ok, fail) { if (ok) render(); });
}
function manualSync() { toast(T('جارٍ الإرسال…', 'Sending…')); syncUp(function (ok, fail) { toast(fail ? T('تعذّر إرسال ' + fail + ' بصمة', fail + ' punch(es) failed') : T('تم إرسال ' + ok + ' بصمة', ok + ' punch(es) sent'), fail ? 'bad' : 'ok'); render(); }); }
function missingPunch() {
  var m = me(); if (!m) return;
  var t = prompt(T('نوع البصمة الناقصة: اكتب in للدخول أو out للخروج', 'Missing punch type: type "in" or "out"'), 'in');
  if (!t) return; t = t.trim().toLowerCase(); if (t !== 'in' && t !== 'out') { toast(T('نوع غير صحيح', 'Invalid type'), 'bad'); return; }
  var ds = prompt(T('التاريخ (YYYY-MM-DD)', 'Date (YYYY-MM-DD)'), ymd(new Date()));
  if (!ds) return;
  var tm = prompt(T('الوقت الفعلي (HH:MM)', 'Actual time (HH:MM)'), cfg().start);
  if (!tm) return;
  var rs = prompt(T('سبب عدم التسجيل (إلزامي)', 'Reason (required)'), '');
  if (!rs) { toast(T('السبب إلزامي', 'Reason is required'), 'bad'); return; }
  var when = new Date(ds + 'T' + (tm.length === 4 ? '0' + tm : tm) + ':00');
  if (isNaN(when.getTime())) { toast(T('تاريخ أو وقت غير صحيح', 'Invalid date/time'), 'bad'); return; }
  var late = (Date.now() - when.getTime()) / 36e5;
  punch(t, when.toISOString(), '[' + T('طلب تعديل بصمة', 'Missing punch') + '] ' + rs + (late > 4 ? ' | ' + T('قُدّم بعد ' + Math.round(late) + ' ساعة — يتطلب اعتماد الموارد البشرية', 'submitted after ' + Math.round(late) + 'h — needs HR approval') : ''));
  if (late > 4) toast(T('تجاوز الطلب مهلة الأربع ساعات — سيظهر للموارد البشرية للاعتماد', 'Beyond the 4-hour window — flagged for HR approval'), 'bad');
}

function adRep(par) {

  else if (per === 'monthly') { from = ymd(new Date(a.getFullYear(), a.getMonth(), 1)); to = ymd(new Date(a.getFullYear(), a.getMonth() + 1, 0)); }

    '<button class="btn pri" onclick="go(\'#/admin?per=\'+document.getElementById(\'rp\').value+\'&emp=\'+encodeURIComponent(document.getElementById(\'re\').value)+\'&d=\'+document.getElementById(\'rd\').value)">' + esc(T('عرض', 'Show')) + '</button>' +

    var e = empBy(empId) || {}, y = a.getFullYear(), rows = '', g = { w: 0, p: 0, ab: 0, lt: 0, h: 0, nd: 0, ot: 0, sh: 0 };

      g.w += t.work; g.p += t.present; g.ab += t.absent; g.lt += t.late + t.lateAbs; g.h += t.worked; g.nd += t.need; g.ot += t.ot; g.sh += t.short;

        '<td class="num">' + minToH(t.worked) + '</td><td class="num">' + minToH(t.need) + '</td><td class="num">' + minToH(t.ot) + '</td><td class="num">' + minToH(t.short) + '</td></tr>';

        .map(function (h) { var p = h.split('|'); return '<th>' + esc(T(p[0], p[1])) + '</th>'; }).join('') +

      '<td class="num">' + minToH(g.ot) + '</td><td class="num">' + minToH(g.sh) + '</td></tr></tfoot></table></div></div>';

      kvc(T('إجازات', 'Leave'), R.t.leave, '') + kvc(T('ساعات فعلية', 'Actual hours'), minToH(R.t.worked), '') +
      kvc(T('ساعات مطلوبة', 'Required'), minToH(R.t.need), '') + kvc(T('إضافي', 'Overtime'), minToH(R.t.ot), '') +

  /* جميع الموظفين */
  var rows2 = L.map(function (e) {

      '<td class="num">' + (t.late + t.lateAbs) + '</td><td class="num">' + t.leave + '</td>' +

  }).join('');
  return ctl + '<div class="panel" style="margin-top:14px"><h3>' + esc(T('جميع الموظفين', 'All employees')) + ' — ' + esc(from) + ' → ' + esc(to) + '</h3>' +

      .map(function (h) { var p = h.split('|'); return '<th>' + esc(T(p[0], p[1])) + '</th>'; }).join('') +

function empSet(i, k, v) { var L = emps(); if (!L[i]) return; L[i][k] = v; saveEmps(L); if (k === 'id' || k === 'name') render(); }

function empAdd() {
  var id = prompt(T('الرقم الوظيفي', 'Employee ID'), 'EMP' + (emps().length + 1)); if (!id) return;
  var nm = prompt(T('الاسم', 'Full name'), ''); if (!nm) return;
  var dp = prompt(T('القسم', 'Department'), '') || '';
  var L = emps(); L.push({ id: id.trim(), name: nm.trim(), dept: dp.trim(), title: '', exempt: false }); saveEmps(L); render();
}
function empExport() {
  var rows = [['id', 'name', 'dept', 'title', 'exempt']];
  emps().forEach(function (e) { rows.push([e.id, e.name, e.dept || '', e.title || '', e.exempt ? 1 : 0]); });
  dl('قائمة الموظفين.csv', csv(rows), 'text/csv');
}
function empImport() {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,text/csv';
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var lines = String(r.result).replace(/^﻿/, '').split(/\r?\n/).filter(function (x) { return x.trim(); });
      var L = emps(), n = 0;
      lines.forEach(function (ln, i) {
        var c = ln.split(',');
        if (i === 0 && /id/i.test(c[0])) return;
        if (!c[0] || !c[1]) return;
        var id = c[0].trim().replace(/^"|"$/g, '');
        if (empBy(id)) return;
        L.push({ id: id, name: (c[1] || '').trim().replace(/^"|"$/g, ''), dept: (c[2] || '').trim().replace(/^"|"$/g, ''), title: (c[3] || '').trim().replace(/^"|"$/g, ''), exempt: /^1|true$/i.test((c[4] || '').trim()) });
        n++;
      });
      saveEmps(L); toast(T('تمت إضافة ' + n + ' موظفاً', n + ' employees added'), 'ok'); render();
    };
    r.readAsText(f, 'utf-8');
  };
  inp.click();
}

      '<div class="field"><label>' + esc(T('النص (عربي) — يُسمح بوسوم بسيطة مثل <p> و<ul>', 'Text (Arabic) — simple tags allowed')) + '</label><textarea id="bAr" style="min-height:230px">' + esc(p.bodyAr) + '</textarea></div>' +
