    '<div class="note">' + esc(T('التعديلات تُحفظ على هذا الجهاز. لتوزيعها على الموظفين: افتح «الإعدادات والربط» ثم «تصدير نسخة للتوزيع» وأرسل الملف الناتج.',
      'Edits are saved on this device. To distribute them: open "Settings & link" then "Export distributable copy" and send the resulting file.')) + '</div>' +
    '</div></div>';
}
function saveEdit(id) {
  var E = lsGet('apx.edits', {}), o = E[id] || {};
  o.ar = document.getElementById('tAr').value;
  o.en = document.getElementById('tEn').value;
  var a = document.getElementById('pAr').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
  var b = document.getElementById('pEn').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
  o.pointsAr = a.length ? a.map(esc) : undefined;
  o.pointsEn = b.length ? b.map(esc) : undefined;
  if (document.getElementById('bAr')) { o.bodyAr = document.getElementById('bAr').value; o.bodyEn = document.getElementById('bEn').value; }
  E[id] = o; lsSet('apx.edits', E); rebuild(); toast(T('تم الحفظ', 'Saved'), 'ok'); render();
}
function revert(id) {
  if (!confirm(T('استرجاع النص الأصلي من الدليل المعتمد؟', 'Revert to the original text?'))) return;
  var E = lsGet('apx.edits', {}); delete E[id]; lsSet('apx.edits', E); rebuild(); render();
}

/* ---------- 6) الإعدادات والربط ---------- */
function adSet() {
  var c = cfg();
  return '<div class="split" style="grid-template-columns:1fr 1fr">' +
    '<div class="panel"><h3>' + esc(T('الربط بسجل الشركة', 'Link to company log')) + '</h3>' +
    '<div class="ps">' + esc(T('عنوان خدمة Google Apps Script التي تكتب البصمات في جدول جوجل الذي تملكه.', 'The Google Apps Script URL that writes punches into your own Google Sheet.')) + '</div>' +
    '<div class="field"><label>' + esc(T('رابط الخدمة (Web App URL)', 'Web App URL')) + '</label><input id="cSrv" dir="ltr" value="' + esc(c.serverUrl) + '" placeholder="https://script.google.com/macros/s/..../exec"></div>' +
    '<div class="field"><label>' + esc(T('مفتاح الإدارة (لسحب سجلات الجميع)', 'Admin key (to pull everyone\'s records)')) + '</label><input id="cKey" dir="ltr" value="' + esc(c.adminKey) + '"></div>' +
    '<div class="btns"><button class="btn pri" onclick="saveLink()">' + esc(T('حفظ', 'Save')) + '</button>' +
    '<button class="btn" onclick="testLink()">⇄ ' + esc(T('اختبار الاتصال', 'Test connection')) + '</button>' +
    '<button class="btn gold" onclick="pullNow()">⟲ ' + esc(T('سحب السجلات', 'Pull records')) + '</button></div>' +
    '<div class="note bad">' + esc(T('مهم: لا تُدرج مفتاح الإدارة في النسخة التي توزعها على الموظفين — التصدير يستبعده تلقائياً.',
      'Important: never include the admin key in the copy you distribute — the export excludes it automatically.')) + '</div>' +
    '</div>' +

    '<div class="panel"><h3>' + esc(T('قواعد الدوام', 'Working-hours rules')) + '</h3>' +
    '<div class="ps">' + esc(T('القيم الافتراضية مأخوذة من الملحق (1) من الدليل.', 'Defaults taken from Appendix 1 of the manual.')) + '</div>' +
    '<div class="row2">' +
    '<div class="field"><label>' + esc(T('بداية الدوام', 'Start')) + '</label><input id="cS" type="time" value="' + esc(c.start) + '"></div>' +
    '<div class="field"><label>' + esc(T('نهاية الدوام', 'End')) + '</label><input id="cE" type="time" value="' + esc(c.end) + '"></div></div>' +
    '<div class="row2">' +
    '<div class="field"><label>' + esc(T('ساعات اليوم', 'Hours per day')) + '</label><input id="cH" type="number" step="0.5" value="' + esc(c.hours) + '"></div>' +
    '<div class="field"><label>' + esc(T('المرونة (دقيقة)', 'Grace (minutes)')) + '</label><input id="cG" type="number" value="' + esc(c.grace) + '"></div></div>' +
    '<div class="row2">' +
    '<div class="field"><label>' + esc(T('الحد الأسبوعي (ساعة)', 'Weekly max (hours)')) + '</label><input id="cW" type="number" value="' + esc(c.maxWeek) + '"></div>' +
    '<div class="field"><label>' + esc(T('العطلة الأسبوعية', 'Weekend')) + '</label><select id="cWk">' +
    [['5,6', 'الجمعة والسبت', 'Friday & Saturday'], ['6,0', 'السبت والأحد', 'Saturday & Sunday'], ['5', 'الجمعة فقط', 'Friday only']]
      .map(function (x) { return '<option value="' + x[0] + '"' + ((c.weekend || []).join(',') === x[0] ? ' selected' : '') + '>' + esc(T(x[1], x[2])) + '</option>'; }).join('') + '</select></div></div>' +
    '<button class="btn pri" onclick="saveRules()">' + esc(T('حفظ القواعد', 'Save rules')) + '</button>' +
    '</div>' +

    '<div class="panel"><h3>' + esc(T('كلمة المرور والهوية', 'Password & identity')) + '</h3>' +
    '<div class="field"><label>' + esc(T('اسم الجهة كما يظهر في الشريط', 'Organization name')) + '</label><input id="cOrg" value="' + esc(c.org) + '"></div>' +
    '<div class="field"><label>' + esc(T('بريد الموارد البشرية', 'HR email')) + '</label><input id="cHr" dir="ltr" value="' + esc(c.hr) + '"></div>' +
    '<div class="field"><label>' + esc(T('كلمة مرور جديدة لمنطقة الإدارة', 'New admin password')) + '</label><input id="cPw" type="password" placeholder="' + esc(T('اتركها فارغة للإبقاء على الحالية', 'leave blank to keep current')) + '"></div>' +
    '<button class="btn pri" onclick="saveIdent()">' + esc(T('حفظ', 'Save')) + '</button>' +
    '<div class="note bad">' + esc(T('ملاحظة أمنية صريحة: هذا ملف واحد يُفتح على أجهزة الموظفين، لذلك كلمة المرور تمنع الدخول العابر فقط ولا تُعد حماية حقيقية — من يفتح الملف بمحرر نصوص يستطيع تجاوزها. الحماية الفعلية لسجل الحضور هي صلاحيات جدول جوجل الذي تملكه أنت وحدك.',
      'Security note: this is a single file opened on employees\' devices, so the password only deters casual access — anyone opening the file in a text editor can bypass it. The real protection for the attendance log is the permissions on the Google Sheet you alone own.')) + '</div>' +
    '</div>' +

    '<div class="panel"><h3>' + esc(T('التوزيع والنسخ الاحتياطي', 'Distribution & backup')) + '</h3>' +
    '<div class="ps">' + esc(T('«نسخة للتوزيع» ملف جاهز للإرسال للموظفين يحمل رابط الخدمة وتعديلاتك وقائمة الموظفين — بدون مفتاح الإدارة وبدون سجلاتك.',
      'The distributable copy carries the service URL, your edits and the employee list — without the admin key or your records.')) + '</div>' +
    '<div class="btns" style="margin-top:12px">' +
    '<button class="btn gold" onclick="exportDist()">⤓ ' + esc(T('تصدير نسخة للتوزيع', 'Export distributable copy')) + '</button>' +
    '<button class="btn" onclick="backup()">⤓ ' + esc(T('نسخة احتياطية (JSON)', 'Backup (JSON)')) + '</button>' +
    '<button class="btn" onclick="restore()">⤒ ' + esc(T('استعادة نسخة', 'Restore')) + '</button>' +
    '<button class="btn" onclick="importCSVPunch()">⤒ ' + esc(T('استيراد بصمات من CSV', 'Import punches CSV')) + '</button>' +
    '</div>' +
    '<div class="note info">' + esc(T('بعد كل تعديل على الدليل أو على قائمة الموظفين، صدّر نسخة جديدة للتوزيع وأرسلها — لتبقى نسخة واحدة معتمدة لدى الجميع.',
      'After any change to the manual or the employee list, export a fresh distributable copy and send it — so everyone holds one approved version.')) + '</div>' +
    '<div class="note">' + esc(T('عدد البصمات المحفوظة محلياً: ', 'Punches stored locally: ')) + punches().length +
    esc(T('  |  المسحوبة من السجل: ', '  |  pulled from the log: ')) + remote().length + '</div>' +
    '</div></div>';
}
function saveLink() { saveCfg({ serverUrl: (document.getElementById('cSrv').value || '').trim(), adminKey: (document.getElementById('cKey').value || '').trim() }); toast(T('تم الحفظ', 'Saved'), 'ok'); render(); }
function saveRules() {
  saveCfg({
    start: document.getElementById('cS').value, end: document.getElementById('cE').value,
    hours: +document.getElementById('cH').value || 8, grace: +document.getElementById('cG').value || 0,
    maxWeek: +document.getElementById('cW').value || 48,
    weekend: document.getElementById('cWk').value.split(',').map(Number)
  });
  toast(T('تم حفظ القواعد', 'Rules saved'), 'ok'); render();
}
function saveIdent() {
  var p = { org: document.getElementById('cOrg').value, hr: document.getElementById('cHr').value };
  var pw = document.getElementById('cPw').value;
  if (pw) p.pwHash = hashPw(pw);
  saveCfg(p); toast(T('تم الحفظ', 'Saved'), 'ok'); render();
}
function testLink() {
  var u = (document.getElementById('cSrv').value || '').trim();
  if (!u) { toast(T('أدخل رابط الخدمة أولاً', 'Enter the URL first'), 'bad'); return; }
  toast(T('جارٍ الاختبار…', 'Testing…'));
  jsonp({ __url: u, action: 'ping' },
    function (d) { toast(d && d.ok ? T('الاتصال سليم ✓ — السجل: ' + (d.sheet || ''), 'Connection OK ✓ — sheet: ' + (d.sheet || '')) : T('ردّ غير متوقع', 'Unexpected reply'), d && d.ok ? 'ok' : 'bad'); },
    function (e) { toast(T('فشل الاتصال: ', 'Connection failed: ') + e, 'bad'); });
}
function exportDist() {
  var c = cfg();
  var baked = {
    serverUrl: c.serverUrl, adminKey: '', pwHash: c.pwHash, org: c.org, hr: c.hr,
    start: c.start, end: c.end, hours: c.hours, grace: c.grace, maxWeek: c.maxWeek, weekend: c.weekend,
    emps: emps(), edits: lsGet('apx.edits', {})
  };
  var js = 'var BAKED = ' + JSON.stringify(baked) + ';/*BAKED*/';
  var out = PRISTINE.replace(/var BAKED = [\s\S]*?;\/\*BAKED\*\//, function () { return js; });
  if (out.indexOf('/*BAKED*/') < 0) { toast(T('تعذّر إنشاء النسخة', 'Export failed'), 'bad'); return; }
  dl('دليل الموظف التفاعلي - Approach.html', out, 'text/html');
  toast(T('تم إنشاء النسخة — أرسلها للموظفين', 'Copy created — send it to employees'), 'ok');
}
function backup() {
  dl('نسخة احتياطية - دليل الموظف - ' + ymd(new Date()) + '.json',
    JSON.stringify({ cfg: lsGet('apx.cfg', {}), emps: emps(), edits: lsGet('apx.edits', {}), punches: punches(), remote: remote(), leaves: leaves() }, null, 1), 'application/json');
}
function restore() {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return; var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (d.cfg) lsSet('apx.cfg', d.cfg); if (d.emps) saveEmps(d.emps); if (d.edits) lsSet('apx.edits', d.edits);
        if (d.punches) savePunches(d.punches); if (d.remote) saveRemote(d.remote); if (d.leaves) saveLeaves(d.leaves);
        rebuild(); toast(T('تمت الاستعادة', 'Restored'), 'ok'); render();
      } catch (e) { toast(T('ملف غير صالح', 'Invalid file'), 'bad'); }
    };
    r.readAsText(f, 'utf-8');
  };
  inp.click();
}
function importCSVPunch() {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv';
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return; var r = new FileReader();
    r.onload = function () {
      var lines = String(r.result).replace(/^﻿/, '').split(/\r?\n/).filter(function (x) { return x.trim(); });
      var R = remote(), n = 0, seen = {}; R.forEach(function (x) { seen[x.id] = 1; });
      lines.forEach(function (ln, i) {
        var c = ln.split(',').map(function (x) { return x.trim().replace(/^"|"$/g, ''); });
        if (i === 0 && /id|emp/i.test(c[0] + c[1])) return;
        if (c.length < 5) return;
        var id = c[0], emp = c[1], name = c[2], type = (c[3] || '').toLowerCase(), date = c[4], time = c[5] || '00:00';
        if (!id || !emp || (type !== 'in' && type !== 'out') || seen[id]) return;
        var ts = new Date(date + 'T' + (time.length === 4 ? '0' + time : time) + ':00').getTime();
        if (isNaN(ts)) return;
        R.push({ id: id, emp: emp, name: name, type: type, ts: ts, date: date, time: time, note: c[6] || '', dev: c[7] || '' });
        seen[id] = 1; n++;
      });
      saveRemote(R); toast(T('تم استيراد ' + n + ' بصمة', n + ' punches imported'), 'ok'); render();
    };
    r.readAsText(f, 'utf-8');
  };
  inp.click();
}

/* ===================== المُشغّل ===================== */
function render() {
  var r = route(), h;
  if (r.view === 'home') h = vHome();
  else if (r.view === 'sec') h = vSec(r.id);
  else if (r.view === 'p') h = vPol(r.id);
  else if (r.view === 'ask') h = vAsk(r.q.q || '');
  else if (r.view === 'punch') h = vPunch();
  else if (r.view === 'me') h = vMe(r.q);
  else if (r.view === 'admin') h = vAdmin(r.q);
  else h = vHome();
  document.getElementById('app').innerHTML = h;
  chrome();
  if (typeof showInstall === 'function') { showInstall(); iosHint(); }
  if (document.getElementById('clk')) startClock();
}
(function boot() {
  rebuild();
  document.body.className = (LANG === 'en' ? 'en' : '');
  document.documentElement.lang = (LANG === 'en' ? 'en' : 'ar');
  document.documentElement.dir = (LANG === 'en' ? 'ltr' : 'rtl');
  var b = document.querySelectorAll('.lang button'), i;
  for (i = 0; i < b.length; i++) b[i].className = (b[i].getAttribute('data-l') === LANG ? 'on' : '');
  render();
  if (cfg().serverUrl) setTimeout(function () { syncUp(function (ok) { if (ok) render(); }); }, 1200);
})();

/* ===================== التثبيت كتطبيق (PWA) ===================== */
var DEFERRED = null;

function isStandalone() {
  try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
  catch (e) { return false; }
}
function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent || '') && !window.MSStream; }
function isHosted() { return String(location.protocol).indexOf('http') === 0; }

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault(); DEFERRED = e; showInstall();
});
window.addEventListener('appinstalled', function () {
  DEFERRED = null; showInstall();
  try { localStorage.setItem('apx.iosHint', '1'); } catch (e) { }
  toast(T('تم تثبيت التطبيق على جهازك ✓', 'App installed ✓'), 'ok');
});

function showInstall() {
  var b = document.getElementById('instBtn'); if (!b) return;
  if (!DEFERRED || isStandalone()) { b.className = 'navbtn hide'; return; }
  b.className = 'navbtn'; b.style.background = 'var(--gold)'; b.style.color = '#241A08';
  b.style.borderColor = 'var(--gold)'; b.style.fontWeight = '700';
  b.textContent = T('⤓ ثبّت التطبيق', '⤓ Install app');
}
function doInstall() {
  if (!DEFERRED) return;
  DEFERRED.prompt();
  DEFERRED.userChoice.then(function () { DEFERRED = null; showInstall(); });
}

/* لافتة الآيفون: سفاري لا يدعم زر التثبيت، فنعرض الخطوتين */
function iosHint() {
  if (!isHosted() || !isIOS() || isStandalone()) return;
  if (lsGet('apx.iosHint', 0)) return;
  if (document.getElementById('iosBar')) return;
  var d = document.createElement('div');
  d.id = 'iosBar'; d.className = 'iosbar';
  d.innerHTML = '<div style="font-size:22px;line-height:1">📲</div>' +
    '<div><b>' + esc(T('ثبّت الدليل على شاشتك الرئيسية', 'Add the manual to your Home Screen')) + '</b>' +
    esc(T('اضغط زر المشاركة ⬆ في أسفل سفاري، ثم اختر «إضافة إلى الشاشة الرئيسية».',
      'Tap the Share button ⬆ in Safari, then choose "Add to Home Screen".')) + '</div>' +
    '<button class="x" onclick="dismissIos()">✕</button>';
  document.body.appendChild(d);
}
function dismissIos() { lsSet('apx.iosHint', 1); var d = document.getElementById('iosBar'); if (d) d.remove(); }

/* ===================== عامل الخدمة والتحديث ===================== */
function swInit() {
  if (!isHosted() || !('serviceWorker' in navigator)) return;
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (refreshing) return; refreshing = true; location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg);
    reg.addEventListener('updatefound', function () {
      var nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', function () {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(reg);
      });
    });
    setInterval(function () { try { reg.update(); } catch (e) { } }, 3600000);
  }).catch(function () { });
}
function showUpdate(reg) {
  if (document.getElementById('upBar')) return;
  var d = document.createElement('div');
  d.id = 'upBar'; d.className = 'upbar';
  d.innerHTML = '<span>' + esc(T('صدر إصدار محدَّث من الدليل', 'An updated version of the manual is available')) + '</span>' +
    '<button onclick="applyUpdate()">' + esc(T('تحديث الآن', 'Update now')) + '</button>' +
    '<button onclick="document.getElementById(\'upBar\').remove()" style="background:transparent;color:#fff;font-weight:400">' + esc(T('لاحقاً', 'Later')) + '</button>';
  document.body.appendChild(d);
  window.__reg = reg;
}
function applyUpdate() {
  var reg = window.__reg;
  if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
  else location.reload();
}

swInit();
showInstall();
iosHint();

</script>
