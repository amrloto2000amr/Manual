<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل الموظف التفاعلي | Approach</title>
<meta name="description" content="دليل الموظف التفاعلي لشركة أبروتش — السياسات وبصمة الحضور">
<meta name="theme-color" content="#1B1B1B">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دليل أبروتش">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
 --ink:#1B1B1B; --ink2:#3A3A3A; --mute:#8A857E; --mute2:#B6B0A8;
 --gold:#C9A063; --gold2:#E9D7BA; --goldsoft:#FBF6EE; --golddark:#A07B3C;
 --paper:#FFFFFF; --mist:#F7F5F2; --line:#E8E3DC;
 --ok:#17693F; --okbg:#E6F4EC; --warn:#B07A10; --warnbg:#FCF3DC;
 --bad:#B3261E; --badbg:#FBE9E7; --info:#2A5FA8; --infobg:#E8F0FB;
 --rad:14px; --sh:0 8px 28px rgba(27,27,27,.08);
 --fs:'Segoe UI','Dubai','Tajawal','Noto Sans Arabic',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{padding-bottom:env(safe-area-inset-bottom);font-family:var(--fs);background:var(--mist);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
body.en{direction:ltr}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none;cursor:pointer}
.hide{display:none !important}
#instBtn{background:var(--gold);color:#241A08;border-color:var(--gold);font-weight:700}
.iosbar{position:fixed;inset-inline:12px;bottom:12px;z-index:60;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 14px 40px rgba(27,27,27,.22);display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.7;max-width:520px;margin:0 auto}
.iosbar b{display:block;margin-bottom:3px}
.iosbar .x{margin-inline-start:auto;color:var(--mute);font-size:18px;line-height:1;flex:none}
.upbar{position:fixed;inset-inline:0;top:0;z-index:70;background:var(--ok);color:#fff;padding:11px 18px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.upbar button{background:#fff;color:var(--ok);font-weight:700;padding:6px 14px;border-radius:999px;font-size:12px}
@media(display-mode:standalone){.pwaOnly{display:none !important}}

/* ============ الهيكل ============ */
.wrap{min-height:100%;display:flex;flex-direction:column}
.topbar{height:62px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:40;flex-wrap:nowrap}
.logo{font-weight:700;font-size:19px;letter-spacing:.14em;white-space:nowrap;direction:ltr}
.logo i{color:var(--gold);font-style:normal}
.vdiv{width:1px;height:24px;background:var(--line);flex:none}
.sub{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.navbtn{font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap;transition:.15s}
.navbtn:hover{background:var(--mist)}
.navbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.navbtn.gold{background:var(--gold);color:#241A08;border-color:var(--gold);font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12.5px;flex:none}
.lang button{padding:7px 13px;color:var(--mute)}
.lang button.on{background:var(--ink);color:#fff;font-weight:600}
main{flex:1}
.page{max-width:1240px;margin:0 auto;padding:0 20px}

/* ============ التذييل ============ */
.credit{background:var(--ink);color:#CFC9C0;padding:18px 20px;margin-top:40px}
.credit .in{max-width:1240px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px}
.credit b{color:#fff;font-weight:600}
.credit .g{color:var(--gold)}
.credit .ltr{direction:ltr;text-align:left}

/* ============ البطل ============ */
.hero{position:relative;background:var(--paper);overflow:hidden;border-bottom:1px solid var(--line)}
.hero .shapes{position:absolute;inset:0;pointer-events:none}
.sA{position:absolute;top:0;left:0;width:30%;height:100%;background:var(--ink);clip-path:polygon(0 0,74% 0,100% 100%,0 100%)}
.sB{position:absolute;top:0;left:23%;width:10%;height:100%;background:var(--gold);clip-path:polygon(0 0,46% 0,100% 100%,54% 100%)}
.sC{position:absolute;top:0;left:30%;width:8%;height:100%;background:var(--gold2);clip-path:polygon(0 0,22% 0,100% 100%,78% 100%)}
body.en .sA{left:auto;right:0;clip-path:polygon(26% 0,100% 0,100% 100%,0 100%)}
body.en .sB{left:auto;right:23%;clip-path:polygon(54% 0,100% 0,46% 100%,0 100%)}
body.en .sC{left:auto;right:30%;clip-path:polygon(78% 0,100% 0,22% 100%,0 100%)}
.heroIn{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:46px 20px 38px}
.heroTxt{max-width:620px}
.kicker{font-size:11.5px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:10px}
h1{font-size:34px;line-height:1.32;font-weight:700;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--gold)}
.lede{font-size:14.5px;color:var(--mute);margin-top:10px;max-width:640px;line-height:1.8}

/* ============ البحث ============ */
.searchbox{margin-top:22px;max-width:700px}
.sbar{display:flex;align-items:center;gap:11px;background:var(--paper);border:1.5px solid var(--ink);border-radius:13px;padding:13px 17px;box-shadow:var(--sh)}
.sbar input{flex:1;border:none;outline:none;background:none;font-size:15px}
.sbar input::placeholder{color:var(--mute2)}
.sbar .go{background:var(--ink);color:#fff;font-size:12.5px;padding:7px 15px;border-radius:999px;font-weight:600}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{font-size:12.5px;color:var(--ink2);background:var(--mist);border:1px solid var(--line);padding:7px 13px;border-radius:999px;transition:.15s}
.chip:hover{background:var(--paper);border-color:var(--gold);color:var(--ink)}

/* ============ الشبكة ============ */
.secthead{display:flex;align-items:baseline;gap:11px;margin:30px 0 14px;flex-wrap:wrap}
.secthead h2{font-size:17px;font-weight:700}
.secthead .en2{font-size:12.5px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:13px;padding:15px 15px 16px;background:var(--paper);position:relative;overflow:hidden;transition:.16s;display:block;text-align:start}
.card:hover{box-shadow:var(--sh);border-color:var(--gold2);transform:translateY(-2px)}
.card .num{font-size:10.5px;font-weight:700;color:var(--gold);letter-spacing:.1em}
.card h3{font-size:14px;font-weight:600;margin-top:7px;line-height:1.45}
.card .en2{font-size:10.5px;color:var(--mute);margin-top:3px}
.card .cnt{font-size:10.5px;color:var(--mute);margin-top:9px}

/* ============ تخطيط القارئ ============ */
.reader{display:flex;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;margin-top:20px;min-height:560px}
.side{width:282px;flex:none;background:var(--mist);border-inline-end:1px solid var(--line);padding:16px 0;max-height:78vh;overflow:auto}
.side .lbl{font-size:10.5px;letter-spacing:.14em;color:var(--mute);padding:0 18px 10px;font-weight:700}
.side a.s{display:block;padding:9px 18px;font-size:12.8px;color:var(--ink2);border-inline-start:3px solid transparent;line-height:1.4}
.side a.s:hover{background:#EFECE7}
.side a.s.on{background:var(--paper);border-inline-start-color:var(--gold);font-weight:700;color:var(--ink)}
.side a.s small{display:block;font-size:10px;color:var(--mute);margin-top:1px;font-weight:400}
.side a.p{display:block;padding:7px 18px 7px 32px;font-size:12.3px;color:var(--mute);line-height:1.4}
.side a.p:hover{color:var(--ink)}
.side a.p.on{color:var(--ink);font-weight:700;background:var(--paper)}
body.en .side a.p{padding:7px 32px 7px 18px}
.content{flex:1;padding:26px 34px 34px;min-width:0}
.crumb{font-size:11.5px;color:var(--mute);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.crumb a:hover{color:var(--ink)}
.content h2.t{font-size:25px;font-weight:700;margin-top:10px;line-height:1.35}
.content .ten{font-size:13px;color:var(--mute);margin-top:4px}
.rule{height:1px;background:var(--line);margin:20px 0}

/* ============ الحقائق والخلاصة ============ */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-top:18px}
.fact{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--paper)}
.fact .k{font-size:11px;color:var(--mute);line-height:1.4}
.fact .v{font-size:20px;font-weight:700;margin-top:5px}
.fact .u{font-size:11px;color:var(--gold);margin-top:2px}
.keybox{background:var(--goldsoft);border:1px solid var(--gold2);border-radius:var(--rad);padding:17px 19px;margin-top:18px}
.keybox .t{font-size:10.5px;letter-spacing:.14em;color:var(--golddark);font-weight:700;margin-bottom:11px}
.keybox ul{list-style:none;display:grid;gap:8px}
.keybox li{font-size:13.5px;color:var(--ink2);display:flex;gap:9px;line-height:1.65}
.tick{min-width:16px;height:16px;border-radius:50%;background:var(--gold);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;margin-top:4px;flex:none}

/* ============ النص ============ */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px}
.two.one{grid-template-columns:1fr}
.col .ch{font-size:10.5px;letter-spacing:.14em;color:var(--mute);font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.pill{display:inline-block;font-size:10px;background:var(--ink);color:#fff;padding:3px 8px;border-radius:999px;letter-spacing:.05em}
.body p{font-size:13.6px;line-height:2;color:var(--ink2);margin-bottom:11px}
.body ul{margin:0 0 12px;padding-inline-start:20px}
.body li{font-size:13.6px;line-height:1.95;color:var(--ink2);margin-bottom:5px}
.body strong{color:var(--ink);font-weight:700}
.col.ltr{direction:ltr;text-align:left}
.col.ltr .body ul{padding-left:20px;padding-right:0}
table.pol{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
table.pol th{background:var(--ink);color:#fff;padding:10px 12px;text-align:start;font-size:12px;font-weight:600}
table.pol td{border:1px solid var(--line);padding:11px 12px;vertical-align:top;line-height:1.8}
table.pol td:first-child{background:var(--goldsoft);font-weight:700;width:150px;color:var(--golddark)}
table.pol td.ltr{direction:ltr;text-align:left}
table.pol p{margin-bottom:7px;font-size:12.8px;line-height:1.8}
table.pol ul{padding-inline-start:18px;margin-bottom:6px}
table.pol li{font-size:12.8px;line-height:1.75}

/* ============ نتائج البحث ============ */
.ans{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:18px}
.ans .h{background:var(--ink);color:#fff;padding:13px 20px;display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.ans .h .tag{background:var(--gold);color:#241A08;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.05em}
.ans .b{padding:20px}
.src{margin-top:14px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--mute);background:var(--mist);border:1px solid var(--line);border-radius:10px;padding:10px 13px;flex-wrap:wrap}
.src b{color:var(--ink)}
.rl{display:grid;gap:8px;margin-top:10px}
.rl a{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px 15px;font-size:13px;color:var(--ink2);background:var(--paper)}
.rl a:hover{border-color:var(--gold);box-shadow:var(--sh)}
.rl a b{font-weight:600;color:var(--ink)}
.rl a span{font-size:11px;color:var(--mute);white-space:nowrap}
.hl{background:#FFF0C2;border-radius:3px;padding:0 2px}
.empty{text-align:center;padding:50px 20px;color:var(--mute);font-size:14px}

/* ============ البصمة ============ */
.punchwrap{display:grid;grid-template-columns:400px 1fr;gap:18px;margin-top:20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);padding:22px}
.panel h3{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .ps{font-size:12px;color:var(--mute);margin-bottom:16px}
.clock{text-align:center;padding:16px 0 6px}
.clock .t{font-size:46px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;direction:ltr}
.clock .d{font-size:12.5px;color:var(--mute);margin-top:4px}
.bigbtn{width:100%;padding:17px;border-radius:14px;font-size:16px;font-weight:700;margin-top:14px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px}
.bigbtn.in{background:var(--ok);color:#fff}
.bigbtn.out{background:var(--ink);color:#fff}
.bigbtn:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.bigbtn:not(:disabled):hover{filter:brightness(1.12)}
.statline{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center}
.stat .k{font-size:10.5px;color:var(--mute)}
.stat .v{font-size:17px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;direction:ltr}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)}
.b-info{background:var(--infobg);color:var(--info)}
.b-mute{background:var(--mist);color:var(--mute)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--mute);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13.5px;outline:none;background:var(--paper)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(27,27,27,.06)}
.field textarea{min-height:80px;line-height:1.7;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.btn{padding:10px 16px;border-radius:10px;font-size:13px;border:1px solid var(--line);color:var(--ink2);background:var(--paper);transition:.15s}
.btn:hover{background:var(--mist)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.btn.gold{background:var(--gold);color:#241A08;border-color:var(--gold);font-weight:700}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.danger{color:var(--bad);border-color:#F0D5D2}
.btns{display:flex;gap:9px;flex-wrap:wrap}

/* ============ الجداول ============ */
.tbl{width:100%;border-collapse:collapse;font-size:12.6px;margin-top:12px}
.tbl th{background:var(--mist);border-bottom:2px solid var(--line);padding:10px 11px;text-align:start;font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap;position:sticky;top:0}
.tbl td{border-bottom:1px solid var(--line);padding:9px 11px;vertical-align:middle}
.tbl tr:hover td{background:var(--mist)}
.tbl .num{font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.tbl tfoot td{font-weight:700;background:var(--goldsoft);border-top:2px solid var(--gold2);border-bottom:none}
.scroll{overflow:auto;max-height:460px;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.scroll .tbl{margin:0}

/* ============ القفل ============ */
.lock{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;position:relative;background:var(--ink);padding:30px 20px}
.lockbg{position:absolute;inset:0;background:linear-gradient(115deg,transparent 46%,rgba(201,160,99,.2) 46%,rgba(201,160,99,.2) 53%,transparent 53%),linear-gradient(115deg,transparent 64%,rgba(255,255,255,.05) 64%,rgba(255,255,255,.05) 80%,transparent 80%)}
.lockcard{position:relative;width:100%;max-width:420px;background:var(--paper);border-radius:20px;padding:34px 30px;box-shadow:0 30px 70px rgba(0,0,0,.42);text-align:center}
.ring{width:52px;height:52px;border-radius:50%;background:var(--goldsoft);border:1px solid var(--gold2);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:21px}
.lockcard h3{font-size:19px;font-weight:700}
.lockcard .s{font-size:12.5px;color:var(--mute);margin-top:7px;line-height:1.7}
.pwin{width:100%;text-align:center;letter-spacing:.4em;font-size:20px;padding:14px;border:1.5px solid var(--line);border-radius:12px;margin:20px 0 4px;outline:none;direction:ltr}
.pwin:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,160,99,.18)}
.err{color:var(--bad);font-size:12px;min-height:18px;margin-top:6px}

/* ============ منطقة الإدارة ============ */
.adbar{background:var(--ink);color:#fff;padding:9px 20px;display:flex;align-items:center;gap:12px;font-size:12px;flex-wrap:wrap}
.adbar .tag{background:var(--gold);color:#241A08;font-weight:700;font-size:10px;padding:3px 9px;border-radius:999px;letter-spacing:.06em}
.adbar .sp{flex:1}
.adbar button{color:#CFC9C0;font-size:12px}
.adbar button:hover{color:#fff}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:16px;overflow:auto}
.tabs button{padding:11px 16px;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}
.note{background:var(--goldsoft);border:1px solid var(--gold2);border-radius:11px;padding:12px 15px;font-size:12.5px;color:var(--golddark);line-height:1.75;margin-top:14px}
.note.info{background:var(--infobg);border-color:#C9DCF5;color:#1F4C87}
.note.bad{background:var(--badbg);border-color:#F0D5D2;color:var(--bad)}
.note.ok{background:var(--okbg);border-color:#C6E4D3;color:var(--ok)}
.split{display:grid;grid-template-columns:270px 1fr;gap:18px;margin-top:16px}
.tree{background:var(--mist);border:1px solid var(--line);border-radius:12px;padding:12px 0;max-height:70vh;overflow:auto}
.tree .g{font-size:11.5px;font-weight:700;padding:9px 15px 5px;color:var(--ink)}
.tree a{display:block;padding:7px 15px 7px 26px;font-size:12.3px;color:var(--mute2)}
body.en .tree a{padding:7px 26px 7px 15px}
.tree a:hover{color:var(--ink)}
.tree a.on{background:var(--paper);color:var(--ink);font-weight:700;border-inline-start:3px solid var(--gold)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-top:14px}
.kvc{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--paper)}
.kvc .k{font-size:11px;color:var(--mute)}
.kvc .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;direction:ltr}
.kvc .u{font-size:10.5px;color:var(--mute);margin-top:2px}

/* ============ استجابة ============ */
@media(max-width:980px){
 .punchwrap,.split{grid-template-columns:1fr}
 .two{grid-template-columns:1fr;gap:20px}
 .reader{flex-direction:column}
 .side{width:100%;max-height:none;border-inline-end:none;border-bottom:1px solid var(--line)}
 .content{padding:20px}
 h1{font-size:26px}
 .sA,.sB,.sC{display:none}
 .heroTxt{max-width:none}
}
@media(max-width:620px){
 .topbar{height:auto;padding:10px 14px;flex-wrap:wrap;gap:9px}
 .sub{display:none}
 .page{padding:0 14px}
 .heroIn{padding:28px 14px 26px}
 .clock .t{font-size:38px}
 .row2{grid-template-columns:1fr}
 .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
@media print{
 .topbar,.side,.chips,.searchbox,.tabs,.btns,.navbtn{display:none !important}
 body{background:#fff}
 .reader{border:none}

<script>
var CONTENT = {"sections":[{"id":"welcome","no":"","ar":"كلمة الترحيب","en":"Welcome","icon":"hand","policies":[{"id":"welcome-1","ref":"","ar":"كلمة المؤسس والرئيس التنفيذي","en":"Founder & CEO's Message","bodyAr":"<p><strong>أهلاً ومرحباً بك في Approach</strong></p><p>يسرنا انضمامك إلى شركة Approach، التي تأسست في المملكة العربية السعودية عام 2008، لتكون شريكاً في رحلة تمتد لأكثر من عقد ونصف من العمل الاتصالي المؤثر.</p><p>تتمثل رؤية Approach في أن نكون الوكالة الاتصالية الأكثر تأثيراً في العالم العربي، عبر تمكين عملائنا من بناء تجارب اتصالية مبتكرة ومتكاملة، تعزز قيمهم وتحقق تواصلاً فعالاً ومستداماً مع جمهورهم.</p><p>في شركة Approach نؤمن بمجموعة من القيم المؤسسية الأساسية التي نعتبرها عنصراً محورياً في نجاحنا المشترك، والتي نعتقد أنها ستدعمك وتوجهك في رحلتك معنا.</p><p>ويمثل \"دليل الموظف\" إطاراً إرشادياً يوضح كيفية عمل الشركة، والمتوقع من كل فرد فيها. ونؤمن بأن وجود هذا الإطار يسهم في توفير بيئة عمل منظمة تمكنك من أداء دورك بأفضل صورة ممكنة.</p><p>وفي الختام، نتمنى لك كل التوفيق والنجاح في دورك معنا، ونتطلع إلى ما يمكننا تحقيقه معاً بانضمامك إلى فريق Approach.</p><p>مع أطيب التمنيات بالتوفيق....</p><p><strong>د. عمار بكار</strong></p><p>المؤسس والرئيس التنفيذي</p>","bodyEn":"<p><strong>Welcome / Ahlan Wa Sahlan!</strong></p><p>I'm delighted to welcome you to Approach Communications, a company that was founded in Saudi Arabia in 2008.</p><p>Approach's vision is to become the most impactful communications agency in the Arab world, by empowering our clients to build innovative and integrated communication experiences that strengthen their values and achieve effective, sustainable engagement with their audiences.</p><p>We believe in a set of core organizational values that we consider a central pillar of our shared success, and which we believe will support and guide you throughout your journey with us.</p><p>The employee manual is a guideline of how the company operates and what is expected. We believe that by having this framework in place, it contributes to providing you with a structure to allow you to do your job in the best possible way. To conclude, I personally wish you every success in your role and look forward to what we can achieve with you as part of the team.</p><p>Best of luck!</p><p><strong>Dr. Ammar Bakkar</strong></p><p>Founder &amp; CEO, Approach Communications</p>"}]},{"id":"s1","no":"1","ar":"دليل الموظف","en":"Manual","policies":[{"id":"s1-0","ref":"1","ar":"دليل الموظف","en":"Manual","bodyAr":"<p>تم إعداد دليل الموظف لتزويدك بمعلومات أساسية عن شركة Approach وتفاصيل علاقتك الوظيفية بها. كما يتضمن الدليل السياسات والإجراءات والقواعد التي تعتمدها الشركة، والتي يُتوقع منك الالتزام بها بصفتك أحد أعضاء فريق Approach.</p><p>يُشار إلى عديد من السياسات والإجراءات والقواعد الواردة في هذا الدليل ضمن عقد العمل الخاص بك. ويُعد بعضها جزءاً لا يتجزأ من عقد العمل المبرم مع Approach، في حين لا يُعد بعضها الآخر كذلك. ويوضح دليل الموظف جلياً كل السياسات والإجراءات والقواعد التي تُعدّ جزءاً من عقد العمل.</p><p>من المهم قراءة هذا الدليل بعناية، وفي حال وجود أي استفسارات تتعلق بمحتواه، يُرجى التواصل مع إدارة الموارد البشرية.</p><p>تحتفظ الشركة بحق تحديث دليل الموظف من وقت لآخر كلما استدعت الحاجة أو طرأت تغييرات تنظيمية أو تشغيلية.</p><p>يغطي هذا الدليل سياسات العمل الخاصة بالشركة، ويُطبّق على فئتين من الموظفين، هما:</p><ul><li><strong>الموظفون المحليون:</strong> وهم الموظفون الذين يعملون من داخل المملكة العربية السعودية أو الإمارات العربية المتحدة.</li><li><strong>الموظفون الدوليون:</strong> وهم الموظفون الذين يعملون من دول أو مواقع لا تمتلك الشركة فيها تواجداً قانونياً.</li></ul>","bodyEn":"<p>The Employee Manual is designed to provide you with information about Approach Communications and details of your employment.</p><p>The Employee manual also contains the policies, procedures and rules, which the organization has adopted, and you are expected to follow as a member of the Approach Communications team.</p><p>Many of the policies, procedures and rules included in the Employee Handbook are referred to in your contract of employment. Some form part of your contract of employment with Approach Communications and some do not. The Employee Handbook specifies which policies, procedures and rules are incorporated into your contract of employment.</p><p>It is important to read the Employee Manual carefully. If you have any questions about its contents, please raise them with the HR. The Employee Handbook will be updated as and when changes occur.</p><p>This manual outlines the Company's workplace policies and applies to two categories of employees:</p><ul><li><strong>Local Employees:</strong> Employees who work from within the Kingdom of Saudi Arabia, or the United Arab Emirates.</li><li><strong>International Employees:</strong> Employees who work from locations or countries where the Company does not have a legal presence.</li></ul>","keys":"دليل الموظف نطاق محلي دولي manual scope local international","pointsAr":["الدليل يوضّح سياسات الشركة وإجراءاتها وما هو متوقَّع منك كعضو في فريق Approach.","بعض سياسات الدليل <b>جزء من عقد العمل</b> وبعضها غير ذلك، والدليل يوضّح أيّها.","يُطبَّق على فئتين: <b>الموظفون المحليون</b> (السعودية والإمارات) و<b>الموظفون الدوليون</b> (دول لا تملك فيها الشركة وجوداً قانونياً).","للشركة حق تحديث الدليل، والاستفسارات تُوجَّه إلى <b>إدارة الموارد البشرية</b>."],"pointsEn":["The manual sets out the policies, procedures and rules expected of every Approach team member.","Some policies <b>form part of your employment contract</b> and some do not; the manual specifies which.","It applies to <b>Local employees</b> (KSA & UAE) and <b>International employees</b> (countries with no legal presence).","The Company may update the manual; questions go to <b>HR</b>."]}]},{"id":"s2","no":"2","ar":"الشركة","en":"Company","policies":[{"id":"s2-0","ref":"2","ar":"الشركة","en":"Company","bodyAr":"<p>شركة Approach هي وكالة اتصال استراتيجي تقدّم حلول اتصال مؤسسي متكاملة، تشمل الاستراتيجيات والمحتوى والإعلام والاتصال الرقمي والرصد وقياس الأثر.</p><p>وتمتلك Approach مكاتب في الرياض ودبي، ما يتيح لها خدمة عملائها المحليين والإقليميين والدوليين بكفاءة عالية.</p>","bodyEn":"<p>We are a strategic communications agency that provides integrated corporate communication solutions, including strategy development, content creation, media relations, digital communications, as well as monitoring and impact measurement.</p><p>Approach operates offices in Riyadh and Dubai, enabling it to efficiently serve local, regional and international clients.</p>"},{"id":"s2-1","ref":"2.1","ar":"القيم المؤسسية","en":"Corporate Values","bodyAr":"<p>نؤمن في Approach بأن تحقيق رؤيتنا ورسالتنا يعتمد -بشكل أساسي- على الالتزام بقيم مؤسسية راسخة. وقد حددنا ثلاث قيم أساسية تمثّل جوهر ثقافتنا، وتوجّه قراراتنا، وتنعكس في طريقة عملنا وتفاعلنا مع عملائنا وشركائنا وزملائنا:</p><ul><li><strong>الجدارة بالثقة:</strong> التي تعني الالتزام بأن نكون جديرين بالثقة، مع تقديم نتائج دقيقة وفي الوقت المحدد باستمرار.</li><li><strong>المرونة:</strong> تعني القدرة على التحرّك بسرعة والتكيف بفاعلية مع التغيير، بروح من المرونة وسرعة الاستجابة.</li><li><strong>الإصرار والمثابرة:</strong> وتعني امتلاك الإصرار والاستمرارية في السعي نحو تحقيق الأهداف، رغم التحديات والعقبات.</li></ul>","bodyEn":"<p>We understand that achieving our mission is based upon strong values and we have identified three that sit right at our core:</p><ul><li><strong>Reliability:</strong> is about the quality of being dependable and consistently delivering accurate and timely results.</li><li><strong>Agility:</strong> is all about the ability to move quickly and adapt effectively to change with flexibility and responsiveness.</li><li><strong>Tenacity:</strong> is about the quality of being determined and persistent in pursuing goals despite challenges or obstacles.</li></ul>","sub":false,"keys":"القيم الجدارة بالثقة المرونة الإصرار values reliability agility tenacity","pointsAr":["<b>الجدارة بالثقة (Reliability):</b> تقديم نتائج دقيقة وفي الوقت المحدد باستمرار.","<b>المرونة (Agility):</b> التحرّك بسرعة والتكيّف الفعّال مع التغيير.","<b>الإصرار والمثابرة (Tenacity):</b> الاستمرار نحو الأهداف رغم التحديات."],"pointsEn":["<b>Reliability:</b> consistently delivering accurate and timely results.","<b>Agility:</b> moving quickly and adapting effectively to change.","<b>Tenacity:</b> staying determined in pursuing goals despite obstacles."]},{"id":"s2-2","ref":"2.2","ar":"الهيكل التنظيمي","en":"Organization Structure","bodyAr":"<p>يوضح \"الهيكل التنظيمي\" الإطار الهرمي والتنظيمي للأقسام داخل شركة Approach. وقد يضم كل قسم عدة فِرق وتخصصات مختلفة، مع الحفاظ على مستوى تنظيمي متكافئ بين الفِرق ذات الصلة، وسيتم الإعلان عن الهيكل التنظيمي المعتمد قريباً.</p><p>يُعد التواصل مع المدير المباشر هو المسار الأساسي لجميع الأمور المتعلقة بالعمل، بينما تُوجَّه المسائل التشغيلية أو المتعلقة بالموارد البشرية إلى إدارة الموارد البشرية حسب الاختصاص.</p><p>ويتعيّن على كل قسم تحديد الأدوار والمسؤوليات لكل فرد، بغضّ النظر عن المستوى الوظيفي، مع الأخذ في الاعتبار العاملين بنظام العمل الحر ضمن هيكل العمل. ويُدار هيكل الشركة ككيان واحد، بغضّ النظر عن الموقع الجغرافي.</p>","bodyEn":"<p>The structure outlines the hierarchical and department structure of Approach Communications. The departments may have multiple teams and varied specialties, all of which will also have an equivalent level. The approved organizational structure will be announced shortly.</p><p>It's important to speak to your direct line manager for work related matters and the HR for operations or HR related matters.</p><p>Each department should consider the roles for each person, irrespective of their level, and also consider freelancers, and within that, the company structure is as a group regardless of geographic location.</p>","sub":false}]},{"id":"s3","no":"3","ar":"السياسات والإجراءات العامة","en":"General Policies & Procedures","policies":[{"id":"s3-1","ref":"3.1","ar":"سياسة السفر والمصروفات","en":"Travel & Expenses","bodyAr":"<p>تنظّم هذه السياسة إجراءات السفر المتعلقة بالعمل وآليات اعتمادها، إضافة إلى قواعد تغطية المصروفات واستردادها، بما يضمن الاستخدام المسؤول لموارد الشركة، والالتزام بالشفافية والدقة في جميع المعاملات المالية.</p><p>يمكن تقديم طلبات الموافقة المسبقة على المصروفات الخاصة بالسفر خارج الدولة واستضافة العملاء، وسيتم تضمين المصروفات المعتمدة ضمن راتب الشهر التالي.</p><p>يحق للموظف المطالبة باسترداد تكاليف وسائل النقل والمأكولات والمشروبات والإقامة، وكل المصروفات المرتبطة بالعمل والتي يتم إنفاقها خلال رحلات العمل أو المؤتمرات أو الفعاليات، وذلك وفقاً لسياسات الشركة المعتمدة.</p><p>يشترط أن تكون تذاكر الطيران على الدرجة الاقتصادية، وأن تكون الإقامة الفندقية في فندق من فئة (4) نجوم، ما لم يرد استثناء بغير ذلك. وفي جميع الأحوال، يجب الاحتفاظ بجميع إيصالات هذه المصروفات وتقديمها إلى الشركة لاعتمادها.</p>","bodyEn":"<p>This policy governs work-related travel procedures and approval processes, as well as the guidelines for expense coverage and reimbursement, ensuring the responsible use of company resources and adherence to transparency and accuracy in all financial transactions.</p><p>Expenses for travel outside the country and client entertainment can be submitted for prior approval and will be included in the following salary.</p><p>Employees are entitled to claim reimbursement for transportation, food and beverage, accommodation, and all work-related expenses incurred during business trips, conferences, or events, in accordance with the company's approved policies.</p><p>Air travel must be booked in economy class, and hotel accommodation must be limited to four-star (4-star) hotels unless otherwise stated. In all cases, employees are required to retain all relevant receipts and submit them to the company for review and approval.</p>","sub":false,"keys":"سفر مصروفات تذاكر فندق استرداد ايصالات travel expenses hotel reimbursement receipts","facts":[{"kAr":"درجة السفر","kEn":"Air travel","v":"اقتصادية","uAr":"","uEn":"","vEn":"Economy"},{"kAr":"فئة الفندق","kEn":"Hotel","v":"4","uAr":"نجوم","uEn":"star"},{"kAr":"موعد الصرف","kEn":"Reimbursed","v":"الشهر التالي","uAr":"ضمن الراتب","uEn":"with next salary","vEn":"Next month"}],"pointsAr":["السفر خارج الدولة واستضافة العملاء يحتاج <b>موافقة مسبقة</b>، وتُدرج المصروفات المعتمدة ضمن <b>راتب الشهر التالي</b>.","يُسترد النقل والمأكولات والإقامة وكل المصروفات المرتبطة بالعمل خلال الرحلات والمؤتمرات والفعاليات.","تذاكر الطيران <b>درجة اقتصادية</b>، والإقامة في فندق <b>4 نجوم</b> ما لم يُستثنَ خلاف ذلك.","يجب <b>الاحتفاظ بجميع الإيصالات</b> وتقديمها للشركة للاعتماد."],"pointsEn":["Overseas travel and client entertainment need <b>prior approval</b>; approved expenses are paid <b>with the next salary</b>.","Transport, food and beverage, accommodation and all work-related trip costs are reimbursable.","Air travel is <b>economy class</b> and hotels are <b>4-star</b> unless otherwise stated.","<b>All receipts must be retained</b> and submitted for approval."]},{"id":"s3-2","ref":"3.2","ar":"فترة التجربة","en":"Probation Period","bodyAr":"<p>عند الانضمام إلى شركة Approach، يخضع الموظف لفترة التجربة، وتتحدد مدة التجربة للموظفين المحليين طبقاً لقانون كل دولة وبناءً على الاتفاق مع الموظف، فيما تتحدد مدة التجربة للموظفين الدوليين بناءً على الاتفاق المسبق مع الموظف، وفي حال عدم وجود اتفاق فهذا يلغي فترة التجربة وما ينطبق عليها أدناه.</p><p>وخلال هذه الفترة، يُتاح لكل من الموظف والشركة تقييم مدى ملاءمة واستمرارية علاقة العمل. وفي الوقت ذاته، يقوم المدير المباشر بتقييم مدى ملاءمة الموظف للدور الوظيفي المسند إليه.</p><p>في حال عدم تحقيق الموظف للمعايير المطلوبة من قبل الشركة، يحق للشركة إنهاء علاقة العمل في أي وقت خلال فترة التجربة، وذلك وفقاً لمتطلبات مدة الإخطار المنصوص عليها في قانون العمل المحلي.</p><p>يُسمح للموظفين في المملكة العربية السعودية بالحصول على إجازات مدفوعة الأجر خلال فترة التجربة.</p><p>تحتفظ شركة Approach بحقها، عند انتهاء فترة التجربة، في عقد اجتماع يتم خلاله تقديم التقييم الخاص بأداء الموظف واتخاذ قرار تثبيته من عدمه. وفي حال التثبيت، يتم تحديد مؤشرات الأداء الرئيسية (KPIs) الخاصة بالمووظف، على أن يتم قياس حجم التقدم فيها خلال أول مراجعة أداء له.</p>","bodyEn":"<p>Upon joining Approach, employees are subject to a probation period. For local employees, the duration of the probation period shall be determined in accordance with the applicable laws of each country and as agreed upon with the employee.</p><p>For international employees, the probation period shall be determined by prior agreement with the employee. In the absence of such an agreement, no probation period shall apply, and the provisions outlined below relating to probation shall not be applicable.</p><p>If the employee doesn't reach the standard required by the company your employment may be terminated at any time during the probationary period based on the local labor law notice period requirement.</p><p>Employees in Saudi Arabia can take paid leave during probation.</p><p>Approach Communications, upon the completion of the probation period, might conduct a meeting to provide feedback on the employee's performance and to decide whether to confirm the employee's appointment. In the event of confirmation, the employee's key performance indicators (KPIs) shall be defined and will be evaluated during the employee's first performance review.</p>","sub":false,"keys":"فترة التجربة تثبيت probation kpi تقييم","facts":[{"kAr":"السعودية والإمارات","kEn":"KSA & UAE","v":"6","uAr":"أشهر كحد أقصى","uEn":"months max"},{"kAr":"الموظفون الدوليون","kEn":"International","v":"3","uAr":"أشهر","uEn":"months"}],"pointsAr":["تتحدد مدة التجربة للموظف المحلي وفق قانون الدولة (حتى <b>6 أشهر</b> في السعودية والإمارات)، وللدولي <b>3 أشهر</b> بالاتفاق المسبق.","إن لم يوجد اتفاق مع الموظف الدولي فلا تسري فترة تجربة أصلاً.","يحق للشركة إنهاء العلاقة خلال فترة التجربة وفق <b>مدة الإخطار</b> في قانون العمل المحلي.","الإجازات <b>مدفوعة</b> خلال فترة التجربة لموظفي السعودية.","عند انتهاء الفترة قد يُعقد اجتماع تقييم، وعند التثبيت تُحدَّد <b>مؤشرات الأداء (KPIs)</b>."],"pointsEn":["Probation follows local law (up to <b>6 months</b> in KSA and UAE) and is <b>3 months</b> for international employees by prior agreement.","With no such agreement, no probation applies to an international employee.","Employment may be terminated during probation subject to the <b>statutory notice period</b>.","Leave is <b>paid</b> during probation for employees in Saudi Arabia.","At the end of probation a review meeting may be held and <b>KPIs</b> are set on confirmation."]},{"id":"s3-3","ref":"3.3","ar":"البيانات الشخصية","en":"Personal Details","bodyAr":"<p>لتمكين الشركة من تقديم الدعم اللازم للموظف، وخاصة في حالات الطوارئ، يُطلب من الموظف تقديم صورة من الهوية الوطنية، بالإضافة إلى تزويد الشركة ببيانات شخص يمكن التواصل معه في حال تعذر الوصول إلى الموظف. ويتم استخدام هذه البيانات في أضيق الحدود وللأغراض الضرورية فقط.</p><p>ومن الضروري أن تكون جميع البيانات الواردة في الملف الوظيفي للموظف كاملة ودقيقة ومحدثة، كما يُرجى إبلاغ إدارة شؤون الموظفين بأي تغييرات تطرأ على البيانات الشخصية، في أقرب وقت ممكن.</p><p>مع العلم أن جميع بيانات الموظف الشخصية سرية، ولا يتم الإفصاح عنها لأي جهة خارجية دون الحصول على موافقتك المسبقة.</p><p>وبالنسبة للموظفين الجدد، يتلقون رسالة ترحيب عبر البريد الإلكتروني، تتضمن بيانات الدخول إلى حسابات البريد الإلكتروني الخاص بهم والتابعة لشركة Approach، إضافة إلى بيانات الوصول إلى الأنظمة والبرامج الداخلية المستخدمة داخل الشركة.</p>","bodyEn":"<p>To help us to assist you, especially in cases of emergency, employees are required to submit their national identification and provide the contact details of an emergency contact person who may be reached in the event that the employee cannot be contacted. Such information shall be used strictly on a limited and need-to-know basis.</p><p>It is essential that all information on your personnel records is complete, correct and up to date. Please inform the HR department of any changes to your personal information.</p><p>Your personal information is confidential and will not be released to outside sources without your prior authorization.</p><p>As a new employee, you will receive a welcome email and you will get login information to your email account and other internally used software.</p>","sub":false,"keys":"بيانات شخصية هوية طوارئ سرية personal details emergency contact id","pointsAr":["يُطلب <b>صورة الهوية الوطنية</b> و<b>بيانات شخص للتواصل في الطوارئ</b>، وتُستخدم في أضيق الحدود.","أبلغ شؤون الموظفين بأي تغيير في بياناتك في أقرب وقت.","بياناتك <b>سرية</b> ولا يُفصح عنها لأي جهة خارجية دون موافقتك المسبقة."],"pointsEn":["A <b>copy of your national ID</b> and an <b>emergency contact</b> are required, used strictly on a need-to-know basis.","Notify HR of any change to your personal details as soon as possible.","Your data is <b>confidential</b> and is not released externally without your prior authorization."]},{"id":"s3-4","ref":"3.4","ar":"العمل الحر","en":"Freelance","bodyAr":"<p>يتم التعاقد مع العاملين بنظام العمل الحر لتنفيذ مهام محددة وبمقابل مالي يتم الاتفاق عليه وفق معدلات منفصلة (بالساعة أو باليوم).</p><p>وفي الدول التي تمتلك فيها Approach ترخيصاً تجارياً سارياً، يخضع المتعاقدون بنظام العمل الحر للقوانين المحلية المعمول بها.</p><p>أما في الدول التي لا تمتلك فيها Approach ترخيصاً تجارياً، فيلتزم المتعاقدون الدوليون بنظام العمل الحر الدولي المبين في الملحق (2) من هذا الدليل.</p>","bodyEn":"<p>Hired for specific tasks, specifically, separate rates/day/hour.</p><p>In countries where Approach holds a valid commercial license, freelance contractors shall be subject to the applicable local laws and regulations.</p><p>In countries where Approach does not hold a commercial license, international contractors shall be governed by the International Freelance Framework set out in Appendix (2) of this manual.</p>","sub":false},{"id":"s3-5","ref":"3.5","ar":"المتدربون","en":"Internship","bodyAr":"<p>يتم إشراك المتدربين والمتدربات في المقام الأول لأغراض التعلم والتطوير المهني، وليس على أساس التوظيف. ولا يُعد المتدربون موظفين بدوام كامل أو مختصين، ولا ينبغي أن يتولوا مسؤوليات أعضاء الفريق الأساسية. ويقتصر دورهم على المتابعة والملاحظة ودعم الفريق في مهام أو مشاريع غير روتينية تتطلّب مساعدة إضافية.</p><p>كما لا يخضع المتدربون لإجراءات مقابلات توظيف رسمية، ولا يتم تخصيص حسابات بريد إلكتروني فردية لهم أو مسميات وظيفية ثابتة. وقد يتم توزيعهم على الإدارات المختلفة لأغراض التدريب العام واكتساب الخبرة العملية.</p>","bodyEn":"<p>Interns and trainees are engaged primarily for learning and professional development rather than employment. They are not full-time employees or specialists and should not take on regular team member responsibilities. Their role is to shadow, observe, and support the team with non-routine tasks or projects that require additional assistance.</p><p>Interns do not undergo formal interviews, and are not assigned individual email accounts or fixed job titles. They may be placed within departments for general training.</p>","sub":false}]},{"id":"s4","no":"4","ar":"سياسات وإجراءات العمل","en":"Working Policies & Procedures","policies":[{"id":"s4-1","ref":"4.1","ar":"ساعات العمل","en":"Working Hours","bodyAr":"<p>تخضع ساعات العمل لقوانين العمل المعمول بها في الدول التي تمتلك فيها الشركة وجوداً قانونياً (السعودية والإمارات)، وهي ثماني (8) ساعات عمل يومياً، وبحد أقصى ثمانية وأربعون (48) ساعة عمل أسبوعياً.</p><p>أما بالنسبة للموظفين الدوليين، فيتم تحديد عدد ساعات العمل وفقاً لما يتم الاتفاق عليه عند التعاقد.</p><p>تُحدَّد أي تعديلات على ساعات العمل وتُعتمد حصرياً من قِبل الرئيس التنفيذي، على أن تقوم إدارة الموارد البشرية بإبلاغ جميع الموظفين بهذه التعديلات في حال إقرارها.</p><p>يُتوقَّع من الموظفين الالتزام بالحضور خلال ساعات العمل المحددة. وفي حال التأخر عن العمل أو التعرض لوعكة صحية، يجب إخطار الإدارة قبل ساعات العمل. كما يُتوقّع من الموظفين العمل لساعات إضافية عند الحاجة ووفق متطلبات العمل.</p><p>لا تسري متطلبات سياسة الحضور والانصراف على المدراء التنفيذيين (Directors &amp; above)؛ نظراً لطبيعة مسؤولياتهم التنفيذية والإدارية.</p>","bodyEn":"<p>Working hours are governed by the labor laws applicable in countries where the Company has a legal presence (KSA &amp; UAE), eight (8) working hours per day with a maximum of forty-eight (48) working hours per week.</p><p>For international employees, working hours shall be determined based on the terms agreed upon at the time of contracting.</p><p>Any changes in working hours shall be determined and approved by the CEO. Such changes should be communicated to all employees by the HR.</p><p>Employees should be at work during this time. Employees who will be late for work or are ill are expected to provide notice before the working hours. Employees are expected to work overtime if required.</p><p>Attendance policy requirements do not apply to Directors &amp; above, given the executive and managerial nature of their responsibilities.</p>","sub":false,"keys":"ساعات العمل دوام 8 48 مواعيد working hours schedule","facts":[{"kAr":"ساعات العمل اليومية","kEn":"Hours per day","v":"8","uAr":"ساعات","uEn":"hours"},{"kAr":"الحد الأسبوعي الأقصى","kEn":"Weekly maximum","v":"48","uAr":"ساعة","uEn":"hours"},{"kAr":"الدوام الرسمي","kEn":"Official schedule","v":"9:00 – 17:00","uAr":"الملحق 1","uEn":"Appendix 1"}],"pointsAr":["يوم العمل <b>ثماني ساعات</b> وبحد أقصى <b>48 ساعة أسبوعياً</b>، والدوام الرسمي من <b>9:00 صباحاً إلى 5:00 مساءً</b> (الملحق 1).","ساعات الموظف الدولي تُحدَّد بما يُتفق عليه عند التعاقد.","أي تعديل على ساعات العمل يُعتمد من <b>الرئيس التنفيذي</b> وتُبلّغه إدارة الموارد البشرية.","عند التأخر أو المرض يجب <b>إخطار الإدارة قبل بداية ساعات العمل</b>، ويُتوقع العمل الإضافي عند الحاجة.","سياسة الحضور <b>لا تسري على المدراء التنفيذيين</b> (Directors فأعلى)."],"pointsEn":["A working day is <b>eight hours</b>, capped at <b>48 hours per week</b>; official hours are <b>9:00 AM to 5:00 PM</b> (Appendix 1).","International employees' hours are set in their contract.","Any change to working hours is approved by the <b>CEO</b> and communicated by HR.","If you will be late or unwell, <b>notify management before the working day starts</b>; overtime is expected when required.","The attendance policy <b>does not apply to Directors and above</b>."]},{"id":"s4-2","ref":"4.2","ar":"الحضور والالتزام بالمواعيد","en":"Attendance & Punctuality","bodyAr":"<p>يُعد الالتزام بالحضور والانضباط في مواعيد العمل والتقيّد بساعات العمل الرسمية داخل مقر العمل مسؤولية أساسية تقع على عاتق جميع موظفي ابروتش.</p><p>يتعيّن على جميع الموظفين تسجيل حضورهم وانصرافهم يومياً عبر تطبيق ZenHR؛ وذلك باستخدام خاصية تسجيل الحضور المدمجة في النظام. ويُعدّ أي يوم غير مسجّل فيه الحضور على النظام غياباً، ما لم يتم إبلاغ المدير المباشر وإدارة الموارد البشرية فوراً وتسجيل الاستثناء عبر ZenHR.</p><p>في حال نسيان تسجيل الحضور أو الانصراف، يتعيّن على الموظف تقديم طلب تصحيح عبر نظام ZenHR من خلال خاصية \"طلب تعديل البصمة\" (Missing Punch feature) المخصصة لهذا الغرض، وذلك خلال أربع (4) ساعات من وقت الحدوث، مع توضيح سبب عدم التسجيل وتوقيت الحضور والانصراف الفعلي. ويخضع الطلب لمراجعة واعتماد إدارة الموارد البشرية التي تحتفظ بحقها في قبوله أو رفضه بناءً على السياق والمبررات المقدمة. وفي حال تكرار النسيان، يحق للشركة اتخاذ الإجراء المناسب.</p><p>في حال تعذر تسجيل الحضور بسبب عطل تقني في نظام ZenHR، يتعيّن على الموظف إبلاغ إدارة الموارد البشرية فوراً، والإعلان عن حضوره وانصرافه على مجموعة الشركة على واتساب كإجراء بديل مؤقت. وتتولى إدارة الموارد البشرية توثيق هذه الحالات يدوياً وتحديث السجلات على النظام فور استعادة عمله. ولا يُعفى الموظف من إثبات حضوره بسبب تعطل النظام.</p><p>ويترتب على عدم الالتزام بساعات العمل الرسمية؛ اتخاذ جزاءات تأديبية كما هو موضح لاحقاً في المادة رقم (10)، وتُطبق هذه الإجراءات وفقاً لسياسات الشركة المعتمدة وأحكام نظام العمل المعمول به.</p><p>يتحمل مديرو الإدارات مسؤولية الإشراف ومتابعة التزام الموظفين بالحضور والانضباط، ورصد أي سلوك أو نمط غير اعتيادي (مثل التأخر المتكرر عن مواعيد العمل الرسمية)، ورفع الأمر إلى مدير الموارد البشرية لاتخاذ الإجراءات التصحيحية اللازمة.</p><p>تم توضيح سياسات وإجراءات الحضور والانصراف بشكل تفصيلي في الملحق رقم (1) من هذا الدليل، ويُعد هذا الملحق جزءاً لا يتجزأ من دليل الموظف، ويلتزم جميع الموظفين بالاطلاع عليه والتقيّد بما ورد فيه.</p>","bodyEn":"<p>Attendance, punctuality and compliance with official working hours at the workplace are the primary responsibility of all Approach Communications employees.</p><p>All employees are required to record their daily attendance and departure through the ZenHR application, using the system's built-in check-in feature. Any day not recorded on the system shall be considered an absence, unless the direct manager and Human Resources Department are notified immediately and the exception is logged through ZenHR.</p><p>In the event that an employee forgets to record their attendance or departure, they must submit a correction request through the ZenHR system using the designated \"Missing Punch\" feature, within four (4) hours of the occurrence, providing a clear explanation of the reason for the missed entry and the actual time of arrival or departure. The request is subject to review and approval by the Human Resources Department, which reserves the right to accept or reject it based on the context and justifications provided. Repeated instances of forgotten registration may result in action.</p><p>In the event that attendance cannot be recorded due to a technical fault in the ZenHR system, the employee must immediately notify the Human Resources Department and announce their attendance and departure on the Company's WhatsApp group as a temporary alternative procedure. The Human Resources Department shall manually document these cases and update the records on the system once it is restored. Employees are not exempt from proving their attendance due to a system malfunction.</p><p>Failure to comply with the official working hours shall result in disciplinary actions as outlined later under Article No. (10). Such measures shall be applied in accordance with the Company's approved policies and the provisions of the applicable Labor Law.</p><p>The Managers are responsible for overseeing and monitoring the punctuality of their employees and to escalate any unusual behavior or trend (i.e. frequent delays from official working hours) to the head of HR to take the corrective action.</p><p>The attendance and leave policies and procedures are outlined in detail in Appendix (1) of this Handbook. This appendix forms an integral part of the Employee Handbook, and all employees are required to review and comply with the provisions stated therein.</p>","sub":false,"keys":"بصمة حضور انصراف نسيت تأخرت zenhr missing punch تسجيل دخول خروج غياب واتساب","facts":[{"kAr":"مهلة تصحيح البصمة","kEn":"Missing-punch window","v":"4","uAr":"ساعات","uEn":"hours"},{"kAr":"النظام المعتمد","kEn":"Official system","v":"ZenHR","uAr":"المرجع عند النزاع","uEn":"reference in disputes"},{"kAr":"يوم بلا تسجيل","kEn":"Unrecorded day","v":"غياب","uAr":"ما لم يُسجَّل استثناء","uEn":"unless logged","vEn":"Absence"}],"pointsAr":["تسجيل الحضور والانصراف يومياً عبر <b>ZenHR</b> إلزامي، و<b>أي يوم غير مسجَّل يُعد غياباً</b> ما لم يُبلَّغ المدير والموارد البشرية فوراً ويُسجَّل الاستثناء.","عند نسيان البصمة: قدّم طلب <b>«تعديل بصمة / Missing Punch» خلال 4 ساعات</b> مع السبب والوقت الفعلي، ويخضع لاعتماد الموارد البشرية قبولاً أو رفضاً.","عند <b>عطل النظام</b>: أبلغ الموارد البشرية فوراً وأعلن حضورك وانصرافك على <b>مجموعة واتساب</b> كإجراء بديل مؤقت — والعطل لا يعفيك من إثبات الحضور.","عدم الالتزام بساعات العمل يستوجب <b>الجزاءات التأديبية</b> الواردة في القسم 10.","مديرو الإدارات مسؤولون عن متابعة الانضباط ورفع أي <b>تأخر متكرر</b> لمدير الموارد البشرية."],"pointsEn":["Daily check-in and check-out on <b>ZenHR</b> is mandatory; <b>any unrecorded day counts as an absence</b> unless your manager and HR are notified immediately and the exception is logged.","If you forget: submit a <b>\"Missing Punch\" request within 4 hours</b> with the reason and the actual time; HR may accept or reject it.","If the <b>system fails</b>: notify HR at once and announce your arrival and departure on the <b>company WhatsApp group</b> — a malfunction does not exempt you from proving attendance.","Non-compliance leads to the <b>disciplinary penalties</b> in Article 10.","Managers must monitor punctuality and escalate <b>repeated lateness</b> to the Head of HR."]},{"id":"s4-3","ref":"4.3","ar":"فترات الراحة والغداء","en":"Lunch & Work Breaks","bodyAr":"<p>لا تعتمد الشركة فترات راحة أو ساعات غداء رسمية محددة. ويُتوقع من الموظفين الحصول على استراحة غداء خلال منتصف اليوم، ويتم تحديد توقيتها ومدتها وفق تقدير الموظف؛ شريطة ألا تؤثر على التزامات العمل، ما لم يطلب مدير الإدارة أو إدارة الموارد البشرية خلاف ذلك.</p>","bodyEn":"<p>The Company does not adopt fixed official break periods or designated lunch hours. Employees are expected to take a lunch break during the middle of the workday, with the timing and duration determined at the employee's discretion, provided that it does not affect work responsibilities or commitments, unless otherwise directed by the Department Head or the Human Resources Department.</p>","sub":false,"keys":"غداء راحة استراحة lunch break","pointsAr":["<b>لا توجد</b> فترات راحة أو ساعة غداء رسمية محددة.","يُتوقع أخذ استراحة غداء في <b>منتصف اليوم</b>، وتوقيتها ومدتها بتقدير الموظف.","بشرط <b>ألا تؤثر على التزامات العمل</b>، ما لم يوجّه مدير الإدارة أو الموارد البشرية بخلاف ذلك."],"pointsEn":["There are <b>no fixed</b> official breaks or lunch hours.","A lunch break is expected around <b>midday</b>, with timing and length at your discretion.","It must <b>not affect work commitments</b>, unless your Department Head or HR directs otherwise."]},{"id":"s4-4","ref":"4.4","ar":"الإنذارات","en":"Warnings","bodyAr":"<p>تُعد الإنذارات جزءاً من إجراءات الموارد البشرية الرسمية الهادفة إلى توثيق أي سلوك غير لائق، أو مخالفات تأديبية، أو تدنٍ في مستوى الأداء، إلى جانب مناقشة هذه الأمور مع الموظف المعني. كما تهدف رسالة الإنذار إلى توضيح التوقعات المستقبلية للسلوك أو الأداء، وقد تُعد تمهيداً لاتخاذ قرار بإنهاء الخدمة في حال عدم التحسّن.</p>","bodyEn":"<p>A formal HR Process to record misconduct, a disciplinary issue or poor performance along with discuss it with the employee. The letter also helps in setting expectations for future behavior and may be a precursor to termination.</p>","sub":false,"keys":"انذار انذارات جزاء سوء سلوك اداء warning misconduct","pointsAr":["الإنذار <b>إجراء رسمي</b> من الموارد البشرية لتوثيق سوء السلوك أو المخالفة التأديبية أو تدني الأداء ومناقشته مع الموظف.","رسالة الإنذار توضّح <b>التوقعات المستقبلية</b> للسلوك أو الأداء.","قد تكون <b>تمهيداً لإنهاء الخدمة</b> في حال عدم التحسّن."],"pointsEn":["A warning is a <b>formal HR process</b> recording misconduct, a disciplinary issue or poor performance, and discussing it with the employee.","The letter sets <b>expectations for future</b> behaviour or performance.","It may be a <b>precursor to termination</b> if there is no improvement."]},{"id":"s4-5","ref":"4.5","ar":"التدخين","en":"Smoking","bodyAr":"<p>حرصاً على صحة وسلامة وراحة الموظفين والعملاء، وامتثالاً للتشريعات المعمول بها، تُطبّق الشركة سياسة منع التدخين داخل مقراتها. ويخضع أي موظف يثبت قيامه بالتدخين داخل مقر الشركة للإجراءات التأديبية المعتمدة.</p>","bodyEn":"<p>In the interests of the health, safety and comfort of employees and customers and to comply with legislation, the organization operates a no smoking policy. Any employee found to be smoking on the premises will be subject to disciplinary procedures.</p>","sub":false,"keys":"تدخين سجائر smoking","pointsAr":["<b>ممنوع التدخين</b> داخل مقار الشركة حفاظاً على الصحة والسلامة وامتثالاً للتشريعات.","من يثبت تدخينه داخل المقر يخضع <b>للإجراءات التأديبية</b> المعتمدة."],"pointsEn":["<b>No smoking</b> on Company premises, for health and safety and to comply with legislation.","Anyone found smoking on the premises is subject to <b>disciplinary procedures</b>."]},{"id":"s4-6","ref":"4.6","ar":"سياسة العمل عن بعد","en":"Regional Remote Operations Policy","bodyAr":"<p>يخضع الموظفون الدوليون للشروط والأحكام التالية:</p><ul><li>عقد عمل حر عن بُعد معتمد من الشركة.</li><li>رصيد الإجازات السنوية.</li><li>الإجازات الدينية حسب ما تعلنه الشركة.</li><li>حساب بريد إلكتروني رسمي تابع للشركة.</li><li>تقييم الأداء، وتحديد الأهداف، ومراجعات الأداء الدورية.</li></ul>","bodyEn":"<p>International Employees are subject to the following terms:</p><ul><li>Company freelance agreement.</li><li>Annual Leave Balance.</li><li>Religious Holidays as per the Company announcements.</li><li>Company Email address.</li><li>Performance, Objectives and reviews.</li></ul>","sub":false,"keys":"عن بعد دولي remote international freelance","pointsAr":["الموظف الدولي يعمل بموجب <b>عقد عمل حر عن بُعد</b> معتمد من الشركة.","يستحق <b>رصيد إجازات سنوية</b> و<b>الإجازات الدينية</b> حسب إعلانات الشركة.","يُمنح <b>بريداً إلكترونياً رسمياً</b> للشركة.","يخضع لـ<b>تقييم الأداء وتحديد الأهداف والمراجعات الدورية</b> كغيره."],"pointsEn":["International employees work under a <b>Company freelance agreement</b>.","They receive an <b>annual leave balance</b> and <b>religious holidays</b> as announced.","They are given a <b>Company email address</b>.","They are subject to <b>performance objectives and periodic reviews</b>."]},{"id":"s4-7","ref":"4.7","ar":"تعارض المصالح","en":"Conflict of Interest","bodyAr":"<p>يحظر على الموظف -سواء بصورة مباشرة أو غير مباشرة- الانخراط في أو امتلاك أي مصلحة، مالية كانت أو غير مالية، في أي نشاط أو مشروع من شأنه أن يؤثر أو يُحتمل أن يؤثر على استقلالية قراره أو على قدرته على أداء مهامه، بما يحقق المصلحة العليا للشركة.</p><p>وفي حال وجود أي لبس أو شك حول ما إذا كان نشاط معيّن قد يشكّل تعارضاً في المصالح، يتعيّن على الموظف مناقشة الأمر مع مديره المباشر والحصول على التوجيه اللازم قبل المضي قدماً في ذلك النشاط.</p><p>وإذا ثبت وجود تعارض في المصالح مع الشركة، يلتزم الموظف بالامتناع عن الاستمرار في ذلك النشاط. وتحتفظ الشركة بحقها في اتخاذ الإجراءات التأديبية اللازمة، كما هو موضح لاحقاً في المادة رقم (10)، وتُطبق هذه الإجراءات وفقاً لسياسات الشركة المعتمدة وأحكام نظام العمل المعمول به في كل دولة.</p>","bodyEn":"<p>Employees must not, directly or indirectly, engage in or have any financial or non-financial interest in any activity or business that may affect, or potentially affect, their ability to act in the best interest of Approach Communications.</p><p>If there is any doubt about whether an activity may create a conflict of interest, the employee must discuss the matter with their direct manager before proceeding.</p><p>If a conflict of interest is identified, the employee must refrain from continuing the activity. The company reserves the right to issue a written warning and to take any necessary legal action as outlined later under Article No. (10). Such measures shall be applied in accordance with the Company's approved policies and the provisions of the applicable Labor Law in each country.</p>","sub":false,"keys":"تعارض مصالح conflict interest","pointsAr":["يُحظر — مباشرة أو غير مباشرة — أي مصلحة مالية أو غير مالية تؤثر على استقلالية قرارك أو أدائك لمصلحة الشركة.","عند الشك، <b>ناقش الأمر مع مديرك المباشر</b> واحصل على التوجيه <b>قبل</b> المضي في النشاط.","عند ثبوت التعارض يلتزم الموظف <b>بالتوقف عن النشاط</b>، وللشركة اتخاذ الإجراء التأديبي والقانوني (القسم 10)."],"pointsEn":["No direct or indirect financial or non-financial interest may affect your ability to act in the Company's best interest.","If in doubt, <b>discuss it with your line manager</b> and get guidance <b>before</b> proceeding.","If a conflict is identified you must <b>stop the activity</b>; the Company may act under Article 10."]},{"id":"s4-8","ref":"4.8","ar":"الانتقال لبلد الشركة","en":"Relocation","bodyAr":"<p>في حالة انتقال أحد موظفي الشركة إلى مكتب آخر تابع لـ Approach، أو انتقال موظف جديد من سوق آخر، تتحمّل الشركة تكاليف السفر أو النقل، وتكاليف الإقامة لمدة تصل إلى شهر واحد. كما تتحمل الشركة جميع تكاليف التأشيرة والتأمين وأي تكاليف ذات صلة.</p><p>وفي حال استغرق الموظف أكثر من شهر واحد لتأمين سكن دائم وترتيبات السفر الخاصة به، يكون الموظف مسؤولاً عن أي تكاليف إضافية ناتجة عن ذلك.</p><p>في حال قرر الموظف الاستقالة من الشركة خلال الاثني عشر (12) شهراً الأولى، تحتفظ الشركة بحقها -في حال عدم الموافقة على الاستقالة ووفقاً للأنظمة المعمول بها وبنود عقد العمل- في مطالبة الموظف بالتعويض عن المدة المتبقية من العقد، بما يعادل راتب شهر عن كل شهر متبقٍ من مدة العقد.</p>","bodyEn":"<p>In the event that the relocation is an existing employee relocation to another office within the network, or of relocation of a new recruit from another market, the company will cover the costs of travel / transport, and accommodation for up to one month for that individual, all visa, insurance and related costs will be provided for.</p><p>If the employee takes longer than one month to finalize a permanent accommodation and travel arrangement, the employee will be responsible for any cost associated with it.</p><p>If an employee resigns within the first twelve (12) months from the date of relocation, the company reserves the right—should the resignation not be approved and in accordance with the applicable laws and the terms of the employment contract—to claim compensation from the employee for the remaining term of the contract, equivalent to one month's salary for each remaining month.</p>","sub":false,"keys":"انتقال نقل relocation سكن تأشيرة","facts":[{"kAr":"تغطية الإقامة","kEn":"Accommodation","v":"1","uAr":"شهر","uEn":"month"},{"kAr":"الاستقالة خلال","kEn":"Resignation within","v":"12","uAr":"شهراً","uEn":"months"}],"pointsAr":["تتحمل الشركة <b>السفر والنقل والإقامة لمدة شهر</b> وجميع تكاليف <b>التأشيرة والتأمين</b> وما يتصل بها.","ما زاد عن <b>شهر واحد</b> لتأمين سكن دائم يتحمّله الموظف.","الاستقالة خلال <b>12 شهراً</b> من الانتقال قد تستوجب تعويض الشركة <b>براتب شهر عن كل شهر متبقٍ</b> من مدة العقد."],"pointsEn":["The Company covers <b>travel, transport and one month's accommodation</b> plus all <b>visa and insurance</b> costs.","Beyond <b>one month</b> to secure permanent housing, costs are borne by the employee.","Resigning within <b>12 months</b> of relocation may require compensation of <b>one month's salary per remaining contract month</b>."]},{"id":"s4-9","ref":"4.9","ar":"الدوام الإضافي","en":"Overtime","bodyAr":"<p>في حال عمل الموظف لساعات تتجاوز دوامه الرسمي خلال أيام العمل العادية أو خلال إجازة نهاية الأسبوع، يحق له التعويض بالخروج المبكر أو الحضور المتأخر في الأيام التالية بما يعادل عدد الساعات الإضافية المنجزة، ويُشترط تسجيل ذلك عبر نظام ZenHR.</p><p>أما الدوام الإضافي الرسمي (العمل خلال الإجازات الرسمية أو في ظروف استثنائية تستوجب ذلك)، فيستلزم هذا النوع الحصول على موافقة كتابية مسبقة من الإدارة عبر البريد الإلكتروني، وإبلاغ إدارة الموارد البشرية، ولا يُعتدّ بأي دوام إضافي رسمي لم تستوفَ فيه هذه الشروط كاملة.</p><ul><li>يجب الحصول على موافقة كتابية مسبقة من المدير المباشر مع إرسال نسخة منها إلى إدارة الموارد البشرية.</li><li>لا يسري نظام العمل الإضافي على مديري الإدارات.</li><li>يخضع العمل الإضافي لأحكام قانون العمل المعمول به.</li><li>يتم احتساب أجر العمل الإضافي بواقع ضعفي أجر ساعة العمل الأساسية.</li></ul>","bodyEn":"<p>In the event that an employee works hours exceeding their official working hours on regular working days or during weekends, they shall be entitled to compensation through early departure or late arrival on subsequent working days, equivalent to the number of additional hours worked. This must be registered through the ZenHR system.</p><p>As for formal overtime (work performed during official public holidays or under exceptional circumstances), it requires prior written approval from management via email and notification to the Human Resources Department. No formal overtime shall be recognized or compensated unless all of the above conditions are fully met.</p><ul><li>Prior written approval from the direct manager is required, with a copy shared with the Human Resources Department.</li><li>Overtime does not apply to Department Managers &amp; Heads.</li><li>Overtime is subject to the applicable labor law.</li><li>Overtime compensation is calculated at twice the regular hourly rate.</li></ul>","sub":false,"keys":"اضافي اوفر تايم overtime ساعات زائدة تعويض","facts":[{"kAr":"أجر الساعة الإضافية","kEn":"Overtime rate","v":"×2","uAr":"ضعف الأجر العادي","uEn":"twice regular rate"},{"kAr":"الموافقة","kEn":"Approval","v":"كتابية مسبقة","uAr":"","uEn":"","vEn":"Prior written"}],"pointsAr":["الساعات الزائدة في أيام العمل العادية أو نهاية الأسبوع تُعوَّض <b>وقتاً</b> (حضور متأخر أو انصراف مبكر) بما يعادلها، <b>ويجب تسجيلها على ZenHR</b>.","الدوام الإضافي <b>الرسمي</b> (العمل في الإجازات الرسمية أو ظروف استثنائية) يتطلب <b>موافقة كتابية مسبقة بالبريد الإلكتروني</b> وإبلاغ الموارد البشرية — وبدون ذلك <b>لا يُعتدّ به ولا يُعوَّض</b>.","أجر الساعة الإضافية يُحتسب بـ<b>ضعفي أجر الساعة الأساسية</b>.","<b>لا يسري</b> نظام العمل الإضافي على مديري الإدارات ورؤسائها."],"pointsEn":["Extra hours on normal days or weekends are compensated with <b>time off in lieu</b> (late arrival or early departure) and <b>must be logged on ZenHR</b>.","<b>Formal overtime</b> (public holidays or exceptional circumstances) requires <b>prior written email approval</b> and notice to HR — otherwise it is <b>not recognised or compensated</b>.","Overtime is paid at <b>twice the regular hourly rate</b>.","Overtime <b>does not apply</b> to Department Managers and Heads."]},{"id":"s4-10","ref":"4.10","ar":"بدل تذاكر الطيران السنوية","en":"Annual Tickets Allowance","bodyAr":"<p>تتكفل الشركة بتوفير تذاكر طيران ذهاباً وإياباً للموظف وأسرته مرة واحدة في السنة للسفر إلى بلد الإقامة الأصلية، وتشمل هذه الميزة الزوج/ة والأبناء بحد أقصى طفلين (2)، وذلك وفقاً للشروط الآتية:</p><p>يحق للموظف تقديم طلب التذاكر اعتباراً من بداية الشهر الرابع من تاريخ التحاقه بالعمل، شريطة أن يكون قد اجتاز فترة التجربة بنجاح. ويتعين تقديم الطلب عبر إدارة الموارد البشرية قبل موعد السفر المقرر بما لا يقل عن ثمانية (8) أسابيع، وذلك حتى يتسنى الحجز بأسعار مناسبة. ولن تتحمل الشركة أي تكاليف إضافية ناجمة عن التأخر في تقديم الطلب.</p><p>تلتزم الشركة بتغطية تكلفة التذاكر بحد أقصى قدره 2000 ريال سعودي للرحلة الواحدة ذهاباً وإياباً للفرد. وفي حال تجاوزت تكلفة التذاكر هذا الحد نتيجة التأخر في الطلب أو لأسباب تعود للموظف، يتحمل الموظف الفرق من حسابه الخاص.</p>","bodyEn":"<p>The Company shall provide annual round-trip air tickets for the employee and their immediate family to their home country once per year. This benefit covers the spouse and children up to a maximum of two (2) children, subject to the following conditions:</p><p>The employee shall be eligible to submit a ticket request starting from the beginning of the fourth month of employment, provided that they have successfully completed their probation period. The request must be submitted through the Human Resources Department no less than eight (8) weeks prior to the intended travel date, in order to secure tickets at reasonable prices. The Company shall not bear any additional costs resulting from a late submission of the request.</p><p>The Company's coverage shall not exceed a maximum of SAR 2,000 per round-trip ticket per person. Any cost exceeding this limit due to late booking or reasons attributable to the employee shall be borne by the employee and deducted accordingly.</p>","sub":false,"keys":"تذكرة طيران بدل تذاكر سنوية ticket allowance flight","facts":[{"kAr":"سقف التذكرة","kEn":"Ticket cap","v":"2,000","uAr":"ريال للفرد ذهاباً وإياباً","uEn":"SAR per person round-trip"},{"kAr":"بداية الاستحقاق","kEn":"Eligible from","v":"الشهر 4","uAr":"بعد فترة التجربة","uEn":"after probation","vEn":"Month 4"},{"kAr":"مهلة تقديم الطلب","kEn":"Notice","v":"8","uAr":"أسابيع","uEn":"weeks"}],"pointsAr":["تذكرة <b>ذهاب وعودة سنوياً</b> للموظف وأسرته إلى بلد الإقامة الأصلية: الزوج/ة و<b>طفلان كحد أقصى</b>.","الاستحقاق من <b>بداية الشهر الرابع</b> من التحاقك بالعمل وبشرط اجتياز فترة التجربة.","يُقدَّم الطلب عبر الموارد البشرية قبل السفر بـ<b>8 أسابيع على الأقل</b>؛ والشركة لا تتحمل أي زيادة بسبب التأخر في الطلب.","سقف التغطية <b>2,000 ريال سعودي</b> للتذكرة ذهاباً وإياباً للفرد، وما زاد يتحمّله الموظف."],"pointsEn":["An <b>annual round-trip ticket</b> for you and your immediate family to your home country: spouse and <b>up to two children</b>.","Eligible from the <b>beginning of the fourth month</b> of employment, after successfully completing probation.","Request through HR at least <b>8 weeks</b> before travel; the Company bears no extra cost caused by a late request.","Coverage is capped at <b>SAR 2,000</b> per round-trip ticket per person; any excess is borne by the employee."]}]},{"id":"s5","no":"5","ar":"سياسة التقييم","en":"Evaluation Policy","policies":[{"id":"s5-1","ref":"5.1","ar":"مراجعة الأداء","en":"Performance Review","bodyAr":"<p>جارٍ العمل على تفعيل نظام مراجعة الأداء، على أن تُجرى مرتين سنوياً خلال شهري يونيو وديسمبر.</p><p>ويستند تقييم الأداء إلى مؤشرات الأداء الرئيسية (KPIs) التي يتم إعدادها من قِبل المدير المباشر بالتنسيق مع قسم الموارد البشرية.</p><p>وكجزء من مراجعة الأداء السنوية، يتم تقييم الموظفين من حيث السلوك العام وفقاً للمعايير التالية:</p><ul><li>المساهمة في تحقيق خطط الشركة وأهدافها.</li><li>السلوك المهني والاتجاهات العامة في العمل.</li><li>الالتزام بسياسات وإجراءات الشركة.</li><li>الالتزام بالمواعيد والحضور.</li></ul><p>وتُسهم هذه العوامل في تحديد درجة السلوك الوظيفي للموظف خلال فترة التقييم.</p><p><strong>نظام التقييم:</strong> يلتزم جميع المديرين المباشرين باتباع نظام التقييم المعتمد عند مراجعة أداء الموظفين. وكلما ارتفعت درجة التقييم، زادت فرص الموظف في التقدم الوظيفي.</p>","bodyEn":"<p>Work is currently underway to implement a performance review system, which will be conducted twice annually in the months of June and December.</p><p>Performance evaluations will be based on key performance indicators (KPIs) developed by the direct manager in coordination with the Human Resources department.</p><p>As part of the annual performance review, employees will be assessed on overall conduct based on the following criteria:</p><ul><li>Contributing to the achievement of the Company's plans and objectives.</li><li>Professional Behavior &amp; Attitude.</li><li>Compliance with Company Policies.</li><li>Punctuality &amp; Attendance.</li></ul><p>These factors will contribute to the employee's conduct score during the review period.</p><p><strong>Scoring system:</strong> All line managers follow the scoring system while reviewing the employees, the higher the score, the more likely the individual will be to progress.</p>","sub":false,"keys":"تقييم اداء مراجعة kpi performance review","facts":[{"kAr":"مواعيد المراجعة","kEn":"Review windows","v":"يونيو وديسمبر","uAr":"","uEn":"","vEn":"June & December"},{"kAr":"عدد المراجعات","kEn":"Frequency","v":"2","uAr":"مرة سنوياً","uEn":"per year"}],"pointsAr":["مراجعات الأداء <b>مرتين سنوياً</b> في <b>يونيو وديسمبر</b> (النظام قيد التفعيل).","التقييم يستند إلى <b>مؤشرات الأداء (KPIs)</b> التي يعدّها المدير المباشر بالتنسيق مع الموارد البشرية.","يُقيَّم السلوك العام على: المساهمة في أهداف الشركة، السلوك المهني، الالتزام بالسياسات، و<b>الالتزام بالمواعيد والحضور</b>.","كلما ارتفعت درجة التقييم زادت فرص <b>التقدم الوظيفي</b>."],"pointsEn":["Reviews are held <b>twice a year</b>, in <b>June and December</b> (system being implemented).","Evaluation is based on <b>KPIs</b> set by the line manager with HR.","Conduct is assessed on contribution to objectives, professional behaviour, policy compliance and <b>punctuality and attendance</b>.","The higher the score, the greater the chance of <b>progression</b>."]},{"id":"s5-2","ref":"5.2","ar":"خطة تحسين الأداء","en":"Performance Improvement Plan (PIP)","bodyAr":"<p>\"خطة تحسين الأداء\" هي وثيقة رسمية تهدف إلى معالجة أوجه القصور في أداء الموظف، من خلال تحديد أهداف واضحة وجداول زمنية محددة للتحسن. ويتم اللجوء إليها عادة عندما يكون أداء الموظف دون المستوى المطلوب، مع وجود إمكانية حقيقية للتطور والنمو. ويجوز إخضاع الموظف لخطة تحسين الأداء بحد أقصى مرتين خلال العام الواحد.</p><p>تبلغ المدة القياسية لخطة تحسين الأداء شهرين، مع إجراء مراجعات دورية كل 15 يوماً لمتابعة مستوى التقدم المحرز. ويجدر التنويه بأن الخضوع لخطة تحسين الأداء قد يؤثر على درجة تقييم الأداء الخاصة بالموظف.</p><p>وفي حال عدم تحقيق النتائج المطلوبة بحلول تاريخ المراجعة النهائية، ودون وجود مبرر مقبول، يحق للشركة اتخاذ الإجراءات المناسبة، والتي قد تشمل -دون حصر-: إعادة التفاوض على العقد، وتعديل الوصف الوظيفي، وتغيير المستوى الوظيفي أو التسلسل الإداري، وتوجيه إنذار كتابي، أو إنهاء علاقة العمل.</p>","bodyEn":"<p>A formal document designed to address an employee's performance deficiencies by setting clear goals and timelines for improvement. It is typically implemented when an employee is underperforming but shows potential for growth and development. Each employee may be placed on a PIP a maximum of two times per year.</p><p>The standard time period for a PIP is two months, with regular reviews scheduled every 15 days to monitor progress. It is important to note that the outcome of being on a PIP may impact the employee's performance score.</p><p>Failure to meet the required outcomes by the final review date, without a valid reason, may result in actions such as contract renegotiation, job description modification, changes in hierarchy level, issuance of a written warning, or termination.</p>","sub":false,"keys":"خطة تحسين الاداء pip","facts":[{"kAr":"مدة الخطة","kEn":"Duration","v":"2","uAr":"شهر","uEn":"months"},{"kAr":"المراجعات","kEn":"Reviews","v":"كل 15 يوماً","uAr":"","uEn":"","vEn":"Every 15 days"},{"kAr":"الحد الأقصى سنوياً","kEn":"Max per year","v":"2","uAr":"مرة","uEn":"times"}],"pointsAr":["خطة تحسين الأداء <b>وثيقة رسمية</b> تعالج القصور بأهداف وجداول زمنية واضحة.","المدة القياسية <b>شهران</b> مع <b>مراجعة كل 15 يوماً</b>، وبحد أقصى <b>مرتين في السنة</b> للموظف الواحد.","الخضوع للخطة <b>قد يؤثر على درجة تقييم الأداء</b>.","عدم تحقيق النتائج بحلول المراجعة النهائية قد يؤدي إلى إعادة التفاوض على العقد أو تعديل الوصف الوظيفي أو تغيير المستوى أو إنذار كتابي أو <b>إنهاء العلاقة</b>."],"pointsEn":["A PIP is a <b>formal document</b> addressing performance gaps with clear goals and timelines.","Standard length is <b>two months</b> with <b>reviews every 15 days</b>, up to <b>twice per year</b>.","Being on a PIP <b>may affect your performance score</b>.","Failing to meet the outcomes may lead to contract renegotiation, job-description change, level change, a written warning or <b>termination</b>."]}]},{"id":"s6","no":"6","ar":"الإجازات","en":"Holidays & Leave","policies":[{"id":"s6-0","ref":"6","ar":"الإجازات","en":"Holidays & Leave","bodyAr":"<p>تمتد سنة الإجازات من 1 يناير وحتى 31 ديسمبر من كل عام.</p><p>فيما يخص الموظفين المحليين، تلتزم الشركة التزاماً كاملاً بمنح الإجازات وفقاً لعدد الأيام المحددة في قانون العمل المعمول به في الدولة التي يتبع لها الكيان القانوني، وذلك بحسب عقد العمل المبرم مع الموظف، إضافة إلى إجازات القطاع الخاص الرسمية المعتمدة في الدولة التي يعمل بها الموظف، وذلك وفقاً للأحكام الواردة في الملحق الثاني الخاص بذلك.</p><p>وفيما يخص الموظفين الدوليين، تُنظَّم الإجازات وفقاً للأحكام الواردة في الملحق الثاني الخاص بذلك.</p><p>يتوافق إجمالي رصيد الإجازات السنوية الممنوح من الشركة مع قانون العمل المحلي، ويجوز منح أيام إضافية بناءً على تقدير الشركة.</p><p>يُسمح بترحيل رصيد الإجازات المتبقي عن السنة المنتهية، وذلك بشرط حصول الموظف على موافقة كتابية مسبقة عبر البريد الإلكتروني من إدارة شؤون الموظفين، بعد الرجوع إلى رأي المدير المباشر، على أن يتم الحصول على هذه الموافقة قبل نهاية السنة.</p><p>نظراً للطبيعة الموسمية لأعمال الشركة، يُشجَّع الموظفون على الحصول على إجازة لمدة أسبوعين خلال أشهر يونيو ويوليو وأغسطس.</p><p>لا يتم تحويل رصيد الإجازات السنوية غير المستخدم إلى مقابل مالي، إلا في حال كان ذلك ضمن التسوية النهائية عند انتهاء علاقة العمل.</p><p>يحق لكل موظف الحصول على إجازة متصلة بحد أقصى أسبوعين (15 يوماً). وأي طلبات تتجاوز هذه المدة تتطلب موافقة استثنائية من الشركة، تُمنح بناءً على الظروف الخاصة بالموظف.</p><p>يتمتّع الموظفون بمرونة استخدام ما يصل إلى خمسة (5) أيام من رصيد الإجازة السنوية بشكل فوري، على أن يتم طلب الإجازة في اليوم السابق عبر البريد الإلكتروني، دون الحاجة إلى تقديم الطلب قبلها بفترة طويلة، وذلك بموافقة المدير المباشر.</p><p>يُطلب من الموظفين إتمام تسليم واضح ومنظم لجميع المهام والمسؤوليات الموكلة إليهم قبل بدء أي إجازة، ومشاركتها مع الزملاء أو أعضاء الفريق المعنيين.</p><p><strong>سياسة تفعيل الرد التلقائي خارج المكتب (OOO):</strong></p><p>يُشترط على جميع الموظفين تفعيل خاصية الرد التلقائي للبريد الإلكتروني (Out of Office) قبل بدء أي إجازة معتمدة، على أن تتضمن رسالة الرد التلقائي ما يلي:</p><ul><li>تاريخ بداية ونهاية الإجازة.</li><li>اسم وبيانات التواصل الخاصة بالموظف البديل في الحالات العاجلة.</li><li>توضيح محدودية أو عدم إمكانية الوصول إلى البريد الإلكتروني خلال فترة الإجازة.</li></ul><p>وفي حال عدم تقديم تسليم مناسب، تحتفظ الشركة بحقها في التواصل مع الموظف أثناء فترة الإجازة لمعالجة أي أمور معلقة أو عاجلة.</p><p>في حال تطلّب العمل قيام الموظف بالعمل خلال الإجازات الرسمية، يحق له الحصول على أحد الخيارين: إما يومي إجازة تعويضية عن كل يوم عمل خلال الإجازة الرسمية، أو تعويض مالي يعادل أجر يومين عن كل يوم عمل خلال الإجازة، على أن تستحق الإجازات التعويضية بعد انتهاء فترة الإجازة الرسمية. ويتم تحديد طريقة التعويض وفقاً لمتطلبات العمل والاحتياجات التشغيلية للشركة.</p>","bodyEn":"<p>The holiday period runs between the 1st January and the 31st December.</p><p>For local employees, the Company fully complies with the number of leave days stipulated under the labor law applicable to the legal entity to which the employee belongs, in accordance with the employment contract, in addition to the officially recognized private sector holidays in the country where the employee works as mentioned in appendix 2.</p><p>For international employees, leave entitlements shall be governed by the provisions set out in the relevant appendix 2.</p><p>Total annual leave given by the company is in line with the labor law of the country, any additional days can be given as discretionary.</p><p>Carryover of any unused annual leave balance from the concluded year shall be permitted, provided that the employee obtains prior written approval via email from Human Resources, following consultation with the direct manager, and that such approval is granted before the end of the year.</p><p>Given the seasonal nature of the business, employees are encouraged to take two weeks worth of leave during the months of June, July and August.</p><p>Unused annual leave will not be converted to salary, unless it is part of final settlement.</p><p>Every employee can take up to 2 weeks (15 days) leave at a stretch. Any requests exceeding this period require exceptional approval from the Company, which shall be granted based on the employee's individual circumstances.</p><p>Employees are granted flexibility to use up to five (5) days from their annual leave balance on short notice, provided that the leave request is submitted one day in advance via email and approved by the direct manager.</p><p>Employees are required to complete a proper handover of all assigned tasks and responsibilities before commencing any leave and to share it with the relevant colleagues or team members.</p><p><strong>Out of Office (OOO) Email Requirement:</strong></p><p>Employees are required to activate an Out of Office (OOO) automatic email reply before starting any approved leave or vacation. The OOO message must include:</p><ul><li>The start and end date of the leave.</li><li>An alternative contact person (name and email) for urgent matters.</li><li>A clear statement indicating limited or no access to email during the leave period.</li></ul><p>In the event that a proper handover is not provided, the company reserves the right to contact the employee during their leave to address any pending or critical matters.</p><p>In the event that an employee is required to work during official public holidays, the employee shall be entitled to either 2 compensatory leave days for each holiday worked, or compensation equivalent to two days' salary for each holiday worked to be taken after the conclusion of the holiday period. The method of compensation shall be determined based on business needs and operational requirements.</p>","keys":"اجازة سنوية رصيد ترحيل عطلة ooo leave annual balance carryover","facts":[{"kAr":"سنة الإجازات","kEn":"Leave year","v":"1 يناير – 31 ديسمبر","uAr":"","uEn":"","vEn":"1 Jan – 31 Dec"},{"kAr":"أقصى إجازة متصلة","kEn":"Max continuous leave","v":"15","uAr":"يوماً (أسبوعان)","uEn":"days (2 weeks)"},{"kAr":"إجازة بإشعار قصير","kEn":"Short-notice days","v":"5","uAr":"أيام من الرصيد","uEn":"days of balance"}],"pointsAr":["سنة الإجازات من <b>1 يناير إلى 31 ديسمبر</b>، والرصيد وفق قانون عمل الدولة (الملحق 2).","<b>ترحيل</b> الرصيد غير المستخدم مسموح بموافقة كتابية مسبقة من الموارد البشرية <b>قبل نهاية السنة</b>.","الحد الأقصى للإجازة المتصلة <b>أسبوعان (15 يوماً)</b>، وما زاد يحتاج موافقة استثنائية.","يمكن استخدام <b>5 أيام</b> من الرصيد بطلب <b>قبل يوم واحد</b> بالبريد وبموافقة المدير المباشر.","الرصيد غير المستخدم <b>لا يُحوَّل إلى مقابل مالي</b> إلا ضمن التسوية النهائية.","قبل أي إجازة: <b>تسليم منظم للمهام</b> و<b>تفعيل الرد التلقائي (OOO)</b> متضمناً تواريخ الإجازة وبديلاً للحالات العاجلة.","العمل في إجازة رسمية يُعوَّض بـ<b>يومَي إجازة</b> أو <b>أجر يومين</b> عن كل يوم، حسب احتياج العمل."],"pointsEn":["The leave year runs <b>1 January to 31 December</b>; entitlement follows local labour law (Appendix 2).","<b>Carry-over</b> of unused leave needs prior written HR approval <b>before year-end</b>.","Maximum continuous leave is <b>two weeks (15 days)</b>; more needs exceptional approval.","<b>Five days</b> of the balance may be taken on <b>one day's notice</b> by email with manager approval.","Unused leave is <b>not paid out</b> except in the final settlement.","Before leave: complete a <b>proper handover</b> and set an <b>Out of Office</b> reply with dates and an alternative contact.","Working on a public holiday is compensated with <b>two days off</b> or <b>two days' pay</b> per day worked."]},{"id":"s6-1","ref":"6.1","ar":"تقديم طلبات الإجازة","en":"Holiday Booking","bodyAr":"<p>تُقدَّم جميع طلبات الإجازة السنوية حصرياً عبر نظام ZenHR، ويتولى النظام متابعة رصيد الإجازات وتحديثه تلقائياً. وتتم الموافقة على طلبات الإجازة من قِبل الموارد البشرية داخل النظام ذاته. ويُشترط تقديم الطلب مع إشعار مسبق لا يقل عن أربعة (4) أسابيع قبل الموعد المطلوب (للإجازات غير الفورية). ولا يُعتدّ بأي طلب إجازة لم يُسجّل عبر ZenHR ويحصل على الموافقة الرسمية من خلاله.</p><p>تُنظر طلبات الإجازات المقدمة دون الالتزام بمدة الإشعار المحددة وفق تقدير الإدارة.</p><p>تُمنح الإجازات وفق
